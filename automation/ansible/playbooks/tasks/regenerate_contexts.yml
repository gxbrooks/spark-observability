---
# Regenerate vars/contexts/* using the installed context-variables CLI
# (generate-contexts). Project data stays in vars/{variables,contexts,secrets}.yaml.
#
# Required: regenerate_contexts_root — absolute path to spark-observability repo root.
# Optional: regenerate_context_names — list of context names; empty = all.
# Optional: regenerate_context_force — pass -f (default false).
# Optional: regenerate_contexts_bin — override CLI path (default: generate-contexts on PATH).

- name: Resolve vars directory and generate-contexts binary
  ansible.builtin.set_fact:
    regenerate_contexts_vars_dir: "{{ regenerate_contexts_root }}/vars"
    regenerate_contexts_cli: "{{ regenerate_contexts_bin | default('generate-contexts') }}"

- name: Build generate-contexts argument list
  ansible.builtin.set_fact:
    _regenerate_context_argv: "{{ [regenerate_contexts_cli, '--vars-dir', regenerate_contexts_vars_dir] + (['-f'] if (regenerate_context_force | default(false)) else []) + (regenerate_context_names | default([])) }}"

- name: Require generate-contexts on PATH
  ansible.builtin.command:
    argv: ["{{ regenerate_contexts_cli }}", "--help"]
  delegate_to: localhost
  connection: local
  become: false
  changed_when: false
  register: regenerate_contexts_help
  failed_when: regenerate_contexts_help.rc != 0

- name: Regenerate context files from project variables (controller)
  ansible.builtin.command:
    argv: "{{ _regenerate_context_argv }}"
  delegate_to: localhost
  connection: local
  become: false
  register: regenerate_contexts_result
  changed_when: >
    'Generating' in (regenerate_contexts_result.stdout | default(''))
    or 'Successfully generated' in (regenerate_contexts_result.stdout | default(''))
