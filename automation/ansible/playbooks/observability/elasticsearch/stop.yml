---
# Stop Kibana then Elasticsearch -- reverse start order, since Kibana
# depends on ES. Combined with start.yml's reasoning: one deployable
# unit, one file per lifecycle verb. Use --tags kibana (or
# elasticsearch) to target just one of the pair.

- name: Stop Kibana
  hosts: observability
  gather_facts: false
  tags: [stop, kibana]
  vars:
    observability_dir: "/home/ansible/ops/observability"
  tasks:
    - name: Stop Kibana container
      ansible.builtin.command: docker compose stop kibana
      args:
        chdir: "{{ observability_dir }}"
      failed_when: false

    - name: Report
      ansible.builtin.debug:
        msg: "Kibana container stopped."

- name: Stop Elasticsearch
  hosts: observability
  gather_facts: false
  tags: [stop, elasticsearch]
  vars:
    observability_dir: "/home/ansible/ops/observability"
  tasks:
    - name: Stop Elasticsearch container
      ansible.builtin.command: docker compose stop es01
      args:
        chdir: "{{ observability_dir }}"
      failed_when: false

    - name: Report
      ansible.builtin.debug:
        msg: "Elasticsearch container stopped."
