---
# Prefer the host Docker Compose .env so probes match the running cluster.
# Controller elastic_observability_ansible_vars.yml may be empty after secrets/context drift.
- name: Read Elasticsearch password from observability .env
  ansible.builtin.shell: |
    awk -F= '/^ES_PASSWORD=/{print substr($0, index($0,$2)); exit}' "{{ observability_env_file }}"
  register: es_password_from_env
  changed_when: false
  failed_when: false

- name: Resolve ES password for API probes
  ansible.builtin.set_fact:
    ES_PASSWORD: >-
      {{ (es_password_from_env.stdout | default('') | trim | length > 0)
         | ternary(es_password_from_env.stdout | trim, ES_PASSWORD | default('') | trim) }}
