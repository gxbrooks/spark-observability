---
- name: Dynatrace stop (operator scale-down)
  hosts: kubernetes_master
  gather_facts: false
  vars_files:
    - "{{ project_root }}/vars/contexts/dynatrace_ansible_vars.yml"
    - "{{ project_root }}/vars/secrets.yaml"
  tasks:
    - name: Apply OOTB Kubernetes monitoring settings (disabled)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/apply_k8s_monitoring_settings.yml"
      vars:
        dt_k8s_mon_mode: disabled

    - name: Scale Dynatrace Operator deployment to zero
      ansible.builtin.command: kubectl -n dynatrace scale deployment dynatrace-operator --replicas=0
      register: operator_scale
      changed_when: operator_scale.rc == 0
      failed_when: false

# Host OneAgent stop notice moved to its own module: see
# automation/ansible/playbooks/oneagent/stop.yml (imported alongside
# this file from observability/stop.yml). Reminder: start.yml restores
# operator/webhook replicas and renews expired dynatrace-webhook-certs
# (webhook CrashLoopBackOff if certs expire while operator is down).
