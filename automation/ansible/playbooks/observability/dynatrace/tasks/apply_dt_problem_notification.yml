---
- name: Resolve Dynatrace API credentials
  ansible.builtin.include_tasks: resolve_dt_api.yml

- name: Ensure brooks-lab alerting profile exists
  ansible.builtin.include_tasks: apply_dt_alerting_profile.yml
  when: dt_alerting_profile_object_id is not defined or (dt_alerting_profile_object_id | string | trim) == ''

# These two reach back into the SGC playbook tree (playbook_dir is the caller's
# events/ dir, e.g. servicenow/sgc/sources/dynatrace/events/) because the
# credential/connection lookup is ServiceNow-side, not Dynatrace-side.
- name: Resolve SGC ConnectionId for webhook payload
  ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/tasks/resolve-sgc-connection-alias.yml"
  when: sn_sgc_scope_present | default(false) | bool

- name: Provision brooks-lab SGO-Dynatrace webhook credentials
  ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/tasks/ensure-sn-dt-webhook-auth.yml"
  when: sn_sgc_scope_present | default(false) | bool

- name: Require SGC (brooks-lab uses only the OOTB SGO-Dynatrace push connector)
  ansible.builtin.assert:
    that:
      - sn_sgc_scope_present | default(false) | bool
    fail_msg: >-
      SGC ({{ sn_sgc_app_scope | default('sn_dynatrace_integ') }}) is not installed on
      {{ sn_url }}. brooks-lab posts problems only to the OOTB SGO-Dynatrace push
      connector, which SGC provides. Run servicenow/sgc/install.yml first.
  run_once: true

- name: Set ServiceNow inbound event URL (OOTB SGO-Dynatrace push connector)
  ansible.builtin.set_fact:
    sn_dt_event_inbound_url_effective: "{{ sn_dt_event_inbound_url_sgc }}"
  run_once: true

- name: List existing problem notifications
  ansible.builtin.uri:
    url: "{{ dt_api_url_resolved }}/v2/settings/objects?schemaIds=builtin:problem.notifications&fields=objectId,value&pageSize=100"
    method: GET
    headers:
      Authorization: "Api-Token {{ dt_api_token_resolved }}"
    status_code: [200]
  register: dt_problem_notifications
  delegate_to: localhost
  run_once: true

- name: Select existing brooks-lab problem notification
  ansible.builtin.set_fact:
    dt_problem_notification_object_id: "{{ item.objectId }}"
    dt_problem_notification_existing_value: "{{ item.value }}"
  loop: "{{ dt_problem_notifications.json['items'] | default([]) }}"
  when: item.value.displayName | default('') == dt_sn_problem_notification_name
  no_log: true
  run_once: true

- name: Default problem notification facts
  ansible.builtin.set_fact:
    dt_problem_notification_object_id: "{{ dt_problem_notification_object_id | default('') }}"
    dt_problem_notification_existing_value: "{{ dt_problem_notification_existing_value | default({}) }}"
  run_once: true

# Representation: specifications/dynatrace/integrations/sgc-problem-notification.json.j2
# (commentary: sgc-problem-notification.md). This run targets the active
# instance, so its notification is enabled; tasks/target.yml disables the others.
# Every template variable is passed as a keyword argument: the lookup reads
# play variables RAW, so a variable defined as a template (the name comes from
# sn_instance_cfg) would be rendered as its literal "{{ ... }}" text.
- name: Render the brooks-lab problem notification
  ansible.builtin.set_fact:
    dt_problem_notification_doc: >-
      {{ lookup('tf_template', dt_integrations_dir + '/sgc-problem-notification.json.j2',
                dt_problem_notification_enabled=true,
                dt_sn_problem_notification_name=dt_sn_problem_notification_name,
                dt_alerting_profile_object_id=dt_alerting_profile_object_id,
                sn_dt_webhook_authorization=sn_dt_webhook_authorization,
                sn_dt_event_inbound_url=sn_dt_event_inbound_url_effective,
                dt_problem_notification_payload_json=(
                  lookup('tf_template', dt_integrations_dir + '/sgc-problem-notification-payload.json.j2') | to_json))
         | from_json }}
  no_log: true
  run_once: true

# Whole-value comparison, so a field dropped from the representation is a
# change too. Dynatrace never returns header secretValue, so that one field is
# left out on both sides; a new webhook secret (first persistence) forces the PUT.
- name: Determine whether problem notification change is needed
  ansible.builtin.set_fact:
    dt_problem_notification_change_needed: >-
      {{ (dt_problem_notification_object_id | length) == 0
         or (sn_dt_webhook_secrets_persist_needed | default(false) | bool)
         or (dt_problem_notification_existing_value
             | combine({'webHookNotification': {'headers': dt_existing_headers}}, recursive=True))
            != (dt_problem_notification_doc.value
             | combine({'webHookNotification': {'headers': dt_wanted_headers}}, recursive=True)) }}
  vars:
    dt_existing_headers: >-
      {{ (dt_problem_notification_existing_value.webHookNotification | default({})).headers | default([])
         | map('dict2items') | map('rejectattr', 'key', 'equalto', 'secretValue') | map('items2dict') | list }}
    dt_wanted_headers: >-
      {{ dt_problem_notification_doc.value.webHookNotification.headers
         | map('dict2items') | map('rejectattr', 'key', 'equalto', 'secretValue') | map('items2dict') | list }}
  run_once: true

- name: Create brooks-lab problem notification
  ansible.builtin.uri:
    url: "{{ dt_api_url_resolved }}/v2/settings/objects"
    method: POST
    headers:
      Authorization: "Api-Token {{ dt_api_token_resolved }}"
      Content-Type: application/json
    body_format: json
    body:
      - "{{ dt_problem_notification_doc }}"
    status_code: [200, 201]
  when: dt_problem_notification_object_id | length == 0
  register: dt_problem_notification_create
  no_log: true
  delegate_to: localhost
  run_once: true

- name: Update brooks-lab problem notification
  ansible.builtin.uri:
    url: "{{ dt_api_url_resolved }}/v2/settings/objects/{{ dt_problem_notification_object_id }}"
    method: PUT
    headers:
      Authorization: "Api-Token {{ dt_api_token_resolved }}"
      Content-Type: application/json
    body_format: json
    body: "{{ dt_problem_notification_doc }}"
    status_code: [200, 204]
  when:
    - dt_problem_notification_object_id | length > 0
    - dt_problem_notification_change_needed | bool
  no_log: true
  delegate_to: localhost
  run_once: true

- name: Show problem notification configuration
  ansible.builtin.debug:
    msg: |
      Problem notification: {{ dt_sn_problem_notification_name }}
      State: {{ 'created/updated' if dt_problem_notification_change_needed | bool else 'already up to date — no change applied' }}
      Webhook URL: {{ sn_dt_event_inbound_url_effective }}
      Alerting profile: {{ dt_alerting_profile_object_id }}
      Auth: brooks-lab SN_DT_WEBHOOK_* (SGO-Dynatrace)
      UI note: this webhook is a Classic builtin:problem.notifications row. It does NOT
      appear under Settings → Connections → ServiceNow until registered there manually.
      Find it via Settings search or Integration → Problem notifications — see
      observability/dynatrace/docs/DT_Problems_to_SN_Event.md § Dynatrace UI navigation.
  run_once: true
