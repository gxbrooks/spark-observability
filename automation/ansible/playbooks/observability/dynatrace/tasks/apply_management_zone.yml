- name: Resolve platform variables
  ansible.builtin.include_tasks: "{{ dt_observability_tasks_dir | default(playbook_dir) }}/tasks/resolve_k8s_cluster.yml"

- name: Resolve Dynatrace specification paths
  ansible.builtin.include_tasks: "{{ dt_observability_tasks_dir | default(playbook_dir) }}/common/resolve_dt_spec_paths.yml"

- name: Resolve Dynatrace API token from flat or nested secrets
  ansible.builtin.set_fact:
    dt_api_url_resolved: "{{ (DT_API_URL.value if (DT_API_URL is mapping and 'value' in DT_API_URL) else DT_API_URL) | default('') }}"
    dt_management_zone_resolved: "{{ (DT_MANAGEMENT_ZONE.value if (DT_MANAGEMENT_ZONE is mapping and 'value' in DT_MANAGEMENT_ZONE) else DT_MANAGEMENT_ZONE) | default('Spark Observability') }}"
    dt_api_token_resolved: "{{ ((DT_AUTOMATION_TOKEN.value if (DT_AUTOMATION_TOKEN is mapping and 'value' in DT_AUTOMATION_TOKEN) else DT_AUTOMATION_TOKEN) | default('', true)) | default((dynatrace | default({})).DT_AUTOMATION_TOKEN | default(''), true) }}"
  delegate_to: localhost
  run_once: true

- name: Render management zone payload from specification
  tf_template:
    src: "{{ dt_mz_settings_file }}"
    dest: /tmp/spark-observability-zone.json
    mode: "0644"
  vars:
    DT_MANAGEMENT_ZONE: "{{ dt_management_zone_resolved }}"
    K8S_DYNATRACE_CLUSTER: "{{ k8s_dynatrace_cluster_name }}"
    dt_sn_spark_client_custom_device_display_name: "Spark Client"
  delegate_to: localhost
  run_once: true

- name: Load management zone document
  ansible.builtin.set_fact:
    mz_document: "{{ lookup('file', '/tmp/spark-observability-zone.json') | from_json }}"
  delegate_to: localhost
  run_once: true

- name: List existing management zone settings objects
  ansible.builtin.uri:
    url: "{{ dt_api_url_resolved }}/v2/settings/objects?schemaIds=builtin:management-zones&fields=objectId,value&pageSize=500"
    method: GET
    headers:
      Authorization: "Api-Token {{ dt_api_token_resolved }}"
    status_code: [200, 401, 403]
  delegate_to: localhost
  run_once: true
  register: mz_settings_list
  failed_when: false

- name: Fail if cannot list management zone settings
  ansible.builtin.assert:
    that:
      - mz_settings_list.status | default(0) == 200
    fail_msg: >-
      Cannot list builtin:management-zones (HTTP {{ mz_settings_list.status | default('unknown') }}).
      Token needs settings.read and settings.write.
  run_once: true

- name: Resolve existing management zone objectId (by value.name)
  ansible.builtin.set_fact:
    mz_object_id: >-
      {{ (mz_settings_list.json['items'] | default([])
          | selectattr('value.name', 'defined')
          | selectattr('value.name', 'equalto', dt_management_zone_resolved)
          | map(attribute='objectId') | list | first) | default('', true) }}
  delegate_to: localhost
  run_once: true

- name: Create management zone settings object
  when: (mz_object_id | trim) == ''
  ansible.builtin.uri:
    url: "{{ dt_api_url_resolved }}/v2/settings/objects"
    method: POST
    headers:
      Authorization: "Api-Token {{ dt_api_token_resolved }}"
      Content-Type: "application/json"
    body_format: json
    body:
      - "{{ mz_document }}"
    status_code: [200, 201, 400, 401, 403, 409, 422]
  delegate_to: localhost
  run_once: true
  register: management_zone_create
  failed_when: false

- name: Assert management zone create succeeded
  when: (mz_object_id | trim) == ''
  ansible.builtin.assert:
    that:
      - management_zone_create.status | default(0) in [200, 201]
    fail_msg: >-
      Dynatrace management zone create failed: HTTP {{ management_zone_create.status | default('unknown') }}
      {{ management_zone_create.json | default(management_zone_create.content) }}
  run_once: true

# Whole-value comparison (a field dropped from the representation is a change).
# Dynatrace leaves default-false propagation flags out of each rule's
# attributeRule when it returns the object, while the representation spells
# them out; those false flags are dropped on both sides before comparing.
- name: Determine whether the management zone differs from its representation
  ansible.builtin.set_fact:
    mz_change_needed: >-
      {%- macro norm(v) -%}
        {%- set rules = [] -%}
        {%- for r in v.rules | default([]) -%}
          {%- if r.attributeRule is defined -%}
            {%- set ar = r.attributeRule | dict2items | rejectattr('value', 'sameas', false) | items2dict -%}
            {%- set _ = rules.append(r | combine({'attributeRule': ar})) -%}
          {%- else -%}{%- set _ = rules.append(r) -%}{%- endif -%}
        {%- endfor -%}
        {{ v | combine({'rules': rules}) | to_json }}
      {%- endmacro -%}
      {{ (mz_object_id | trim) != ''
         and norm(mz_settings_list.json['items'] | selectattr('objectId', 'equalto', mz_object_id)
                  | map(attribute='value') | first) != norm(mz_document.value) }}
  run_once: true

- name: Report which management zone keys differ (names only)
  ansible.builtin.debug:
    msg: >-
      Management zone differs in:
      {%- for k in (mz_live.keys() | list + mz_document.value.keys() | list) | unique %}
      {%- if mz_live.get(k) != mz_document.value.get(k) %} [{{ k }}]{% endif %}{% endfor %}
  vars:
    mz_live: "{{ mz_settings_list.json['items'] | selectattr('objectId', 'equalto', mz_object_id) | map(attribute='value') | first }}"
  when: mz_change_needed | bool
  run_once: true

- name: Update management zone settings object
  when: mz_change_needed | bool
  ansible.builtin.uri:
    url: "{{ dt_api_url_resolved }}/v2/settings/objects/{{ mz_object_id }}"
    method: PUT
    headers:
      Authorization: "Api-Token {{ dt_api_token_resolved }}"
      Content-Type: "application/json"
    body_format: json
    body: "{{ dict(value=mz_document.value) }}"
    status_code: [200, 400, 401, 403, 404, 409, 422]
  delegate_to: localhost
  run_once: true
  register: management_zone_update
  failed_when: false

- name: Assert management zone update succeeded
  when: mz_change_needed | bool
  ansible.builtin.assert:
    that:
      - management_zone_update.status | default(0) == 200
    fail_msg: >-
      Dynatrace management zone update failed: HTTP {{ management_zone_update.status | default('unknown') }}
      {{ management_zone_update.json | default(management_zone_update.content) }}
  run_once: true
