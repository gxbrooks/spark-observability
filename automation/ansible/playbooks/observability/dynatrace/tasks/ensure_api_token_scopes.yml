# Check that DT_AUTOMATION_TOKEN (classic access token, class 1 in vars/docs/secrets.md) has every
# scope the automation uses. The token looks itself up; nothing is created or rotated here.
- name: Resolve the API URL and automation token
  ansible.builtin.set_fact:
    dt_api_url_resolved: "{{ (DT_API_URL.value if (DT_API_URL is mapping and 'value' in DT_API_URL) else DT_API_URL) | default('') }}"
    dt_api_token_resolved: "{{ ((DT_AUTOMATION_TOKEN.value if (DT_AUTOMATION_TOKEN is mapping and 'value' in DT_AUTOMATION_TOKEN) else DT_AUTOMATION_TOKEN) | default('', true)) | default((dynatrace | default({})).DT_AUTOMATION_TOKEN | default(''), true) }}"
  no_log: true

- name: Define the scopes DT_AUTOMATION_TOKEN needs
  ansible.builtin.set_fact:
    dt_api_required_scopes:
      - settings.read
      - settings.write
      - entities.read
      - entities.write
      - metrics.read
      - problems.read
      - logs.read
      - ReadConfig
      - WriteConfig
      - apiTokens.read
      - apiTokens.write
      - InstallerDownload

- name: Lookup DT_AUTOMATION_TOKEN metadata
  ansible.builtin.uri:
    url: "{{ dt_api_url_resolved }}/v2/apiTokens/lookup"
    method: POST
    headers:
      Authorization: "Api-Token {{ dt_api_token_resolved }}"
      Content-Type: "application/json"
    body_format: json
    body:
      token: "{{ dt_api_token_resolved }}"
    status_code: [200]
  register: dt_api_token_lookup
  no_log: true

- name: Assert DT_AUTOMATION_TOKEN has the required scopes
  ansible.builtin.assert:
    that:
      - (dt_api_required_scopes | difference(dt_api_token_lookup.json.scopes | default([]))) | length == 0
    fail_msg: >-
      DT_AUTOMATION_TOKEN is missing scopes
      {{ dt_api_required_scopes | difference(dt_api_token_lookup.json.scopes | default([])) }}.
      Create a replacement access token with the scopes in vars/docs/secrets.md.
    quiet: true
