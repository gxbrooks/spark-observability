---
# Host OneAgent install moved to its own module: see
# automation/ansible/playbooks/oneagent/install.yml (imported alongside
# this file from observability/install.yml) -- OneAgent is a host
# agent, not Dynatrace SaaS/tenant config, same split Elastic Agent
# already gets from observability/elasticsearch/.

- name: Dynatrace install (GPU sampler on Kubernetes worker nodes)
  hosts: kubernetes_workers
  become: false
  gather_facts: true
  vars_files:
    - "{{ project_root }}/vars/contexts/dynatrace_ansible_vars.yml"
    - "{{ project_root }}/vars/secrets.yaml"
  handlers:
    - name: Restart gpu-metrics-dt timer
      ansible.builtin.systemd:
        name: gpu-metrics-dt.timer
        state: restarted
      become: true
  tasks:
    - name: Install AMD GPU → Dynatrace sampler and systemd timer
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/install_gpu_sampler.yml"
        apply:
          tags: [gpu_sampler]
      tags: [gpu_sampler]
