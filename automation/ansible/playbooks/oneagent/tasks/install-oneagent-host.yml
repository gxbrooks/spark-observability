- name: Resolve the Dynatrace automation token from flat or nested secrets
  ansible.builtin.set_fact:
    dt_api_url_resolved: "{{ (DT_API_URL.value if (DT_API_URL is mapping and 'value' in DT_API_URL) else DT_API_URL) | default('') }}"
    dt_environment_resolved: "{{ (DT_ENVIRONMENT.value if (DT_ENVIRONMENT is mapping and 'value' in DT_ENVIRONMENT) else DT_ENVIRONMENT) | default('lab') }}"
    dt_owned_by_resolved: "{{ (DT_OWNED_BY.value if (DT_OWNED_BY is mapping and 'value' in DT_OWNED_BY) else DT_OWNED_BY) | default('gbrooks') }}"
    dt_automation_token_resolved: "{{ ((DT_AUTOMATION_TOKEN.value if (DT_AUTOMATION_TOKEN is mapping and 'value' in DT_AUTOMATION_TOKEN) else DT_AUTOMATION_TOKEN) | default('', true)) | default((dynatrace | default({})).DT_AUTOMATION_TOKEN | default(''), true) }}"
  no_log: true

- name: Assert OneAgent prerequisites
  ansible.builtin.assert:
    that:
      - (dt_api_url_resolved | default('') | trim) != ''
      - (dt_automation_token_resolved | default('') | trim) != ''
      - (DT_HOST_GROUP | default('') | trim) != ''
    fail_msg: "DT_API_URL, DT_AUTOMATION_TOKEN, and DT_HOST_GROUP are required."

# The installer is downloaded on the controller and copied to the host, so the automation token
# (class 1, vars/docs/secrets.md) never reaches a Lab host. The token goes in a header, not the URL.
- name: Download the OneAgent installer on the controller
  ansible.builtin.get_url:
    url: "{{ dt_api_url_resolved }}/v1/deployment/installer/agent/unix/default/latest?flavor=default"
    headers:
      Authorization: "Api-Token {{ dt_automation_token_resolved }}"
    dest: "{{ lookup('env', 'HOME') }}/.cache/dynatrace-oneagent.sh"
    mode: "0600"
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Copy the OneAgent installer to the host
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/.cache/dynatrace-oneagent.sh"
    dest: /tmp/dynatrace-oneagent.sh
    mode: "0755"

- name: Check if OneAgent is already installed
  ansible.builtin.stat:
    path: /opt/dynatrace/oneagent/agent/lib64/liboneagentproc.so
  register: oneagent_installed

- name: Install OneAgent
  ansible.builtin.command: >
    /bin/sh /tmp/dynatrace-oneagent.sh
    --set-app-log-content-access=true
    --set-host-group={{ DT_HOST_GROUP }}
    --set-host-property=Project=spark-observability
    --set-host-property=Environment={{ dt_environment_resolved }}
    --set-host-property=OwnedBy={{ dt_owned_by_resolved }}
  become: true
  when: not oneagent_installed.stat.exists

- name: Remove OneAgent installer script
  ansible.builtin.file:
    path: /tmp/dynatrace-oneagent.sh
    state: absent
