---
# ServiceNow start — MID Server + Dynatrace SGC import cascade.
# Usage:
#   cd ansible
#   ansible-playbook -i inventory.yml playbooks/servicenow/start.yml -e @../vars/secrets.yaml
#
# On-demand Discovery scans are not auto-triggered here; run
# discovery/start.yml --tags discovery_scan explicitly.

- import_playbook: tasks/target.yml
  vars:
    sn_target_playbook: start.yml
    sn_target_mode: switch

- name: ServiceNow start banner
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always, servicenow]
  tasks:
    - name: Display ServiceNow start information
      ansible.builtin.debug:
        msg: |
          ServiceNow start: discovery/start.yml → discovery/k8s/start.yml → sgc/sources/dynatrace/start.yml
          For a CI Discovery scan: playbooks/servicenow/discovery/start.yml --tags discovery_scan

- import_playbook: discovery/start.yml
  tags: [servicenow]

- import_playbook: discovery/k8s/start.yml
  tags: [servicenow]

- import_playbook: sgc/sources/dynatrace/start.yml
  tags: [servicenow]
