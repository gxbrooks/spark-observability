---
# Validate Dynatrace → ServiceNow events after workload (chapters / stress)
# Usage:
#   ansible-playbook -i inventory.yml playbooks/servicenow/sgc/sources/dynatrace/events/test.yml -e @../vars/secrets.yaml

- import_playbook: ../../../../tasks/target.yml
  vars:
    sn_target_playbook: sgc/sources/dynatrace/events/test.yml
    sn_target_mode: active

- name: Test for recent Dynatrace-sourced ServiceNow events
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir | regex_replace('/automation/ansible/playbooks/.*$', '') }}/vars/contexts/servicenow_ansible_vars.yml"
    - "{{ playbook_dir | regex_replace('/automation/ansible/playbooks/.*$', '') }}/vars/contexts/dynatrace_ansible_vars.yml"
    - "{{ playbook_dir | regex_replace('/automation/ansible/playbooks/.*$', '') }}/vars/secrets.yaml"
    - "{{ playbook_dir | regex_replace('^(.*/sgc)(/.*)?$', '\\1') }}/common/vars.yml"
  tasks:
    - name: Detect SGC installation
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/tasks/check-sgc-prerequisites.yml"

    - name: Assert recent SGO-Dynatrace events
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/tasks/test-recent-sgc-events.yml"
