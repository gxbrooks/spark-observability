---
# Dynatrace → ServiceNow event integration (alerting profiles, detectors, webhook)
# Usage:
#   cd ansible
#   ansible-playbook -i inventory.yml playbooks/servicenow/sgc/sources/dynatrace/events/deploy.yml -e @../vars/secrets.yaml
# OpenPipeline Spark log alerts only (plus the SGO unmatched-CI events property;
# no webhook / management zone / custom source):
#   ... events/deploy.yml -e @../vars/secrets.yaml --tags openpipeline

- import_playbook: ../../../../tasks/target.yml
  vars:
    sn_target_playbook: sgc/sources/dynatrace/events/deploy.yml
    sn_target_mode: switch

- name: Configure Dynatrace alerting and ServiceNow event webhook for brooks-lab
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir | regex_replace('/automation/ansible/playbooks/.*$', '') }}/vars/contexts/servicenow_ansible_vars.yml"
    - "{{ playbook_dir | regex_replace('/automation/ansible/playbooks/.*$', '') }}/vars/contexts/dynatrace_ansible_vars.yml"
    - "{{ playbook_dir | regex_replace('^(.*/sgc)(/.*)?$', '\\1') }}/common/vars.yml"
    - "{{ playbook_dir | regex_replace('/automation/ansible/playbooks/.*$', '') }}/vars/secrets.yaml"
  tasks:
    - name: Resolve observability Dynatrace tasks directory
      ansible.builtin.set_fact:
        dt_observability_tasks_dir: >-
          {{ playbook_dir | regex_replace('/automation/ansible/playbooks/.*$', '') }}/automation/ansible/playbooks/observability/dynatrace
      run_once: true
      tags: [always]

    - name: Detect SGC installation (controls webhook source= parameter)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/tasks/check-sgc-prerequisites.yml"

    - name: Ensure SGO unmatched-CI events property
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir | dirname }}/tasks/ensure-spark-entity-cmdb-bindings.yml"
        apply:
          tags: [openpipeline]
      tags: [openpipeline]

    - name: Apply Spark Observability management zone
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/tasks/apply-spark-management-zone.yml"

    - name: Apply brooks-lab alerting profile (Spark Observability management zone)
      ansible.builtin.include_tasks: "{{ dt_observability_tasks_dir }}/tasks/apply_dt_alerting_profile.yml"

    - name: Register Spark log paths with Dynatrace OneAgent
      ansible.builtin.include_tasks: "{{ dt_observability_tasks_dir }}/tasks/apply_spark_log_custom_source.yml"

    - name: Apply OpenPipeline Davis extraction for Spark ERROR/WARN logs
      ansible.builtin.include_tasks:
        file: "{{ dt_observability_tasks_dir }}/tasks/apply_spark_openpipeline_log_alerts.yml"
        apply:
          tags: [openpipeline]
      tags: [openpipeline]

    - name: Apply CPU metric detector (classic log event disabled — OpenPipeline is canonical)
      ansible.builtin.include_tasks: "{{ dt_observability_tasks_dir }}/tasks/apply_dt_anomaly_detectors.yml"

    - name: Apply eShop RabbitMQ queue metric events (backlog, no consumer)
      ansible.builtin.include_tasks: "{{ dt_observability_tasks_dir }}/tasks/apply-eshop-queue-metric-events.yml"

    - name: Apply brooks-lab problem notification webhook to ServiceNow
      ansible.builtin.include_tasks: "{{ dt_observability_tasks_dir }}/tasks/apply_dt_problem_notification.yml"
