---
# Ensure SGC ingests Dynatrace problems whose ImpactedEntities have no
# topology CI match (e.g. HOST-only log problems before lab BRs rebind).
# Client/Cluster log bind no longer relies on CUSTOM_DEVICE SOS / cmdb_key_value;
# ResolveApplicationService uses spark.service_instance / spark.pod_identifier.

- name: Look up SGC unmatched-CI events property
  ansible.builtin.uri:
    url: >-
      {{ sn_url }}/api/now/table/sys_properties?{{
        {
          'sysparm_query': 'name=sn_dynatrace_integ.events_for_unmatched_ci.enabled',
          'sysparm_fields': 'sys_id,name,value',
          'sysparm_limit': '1'
        } | urlencode
      }}
    method: GET
    url_username: "{{ sn_user }}"
    url_password: "{{ sn_password }}"
    force_basic_auth: true
    headers: "{{ sn_api_headers }}"
    status_code: [200]
  register: sn_unmatched_ci_prop
  delegate_to: localhost
  run_once: true

- name: Enable SGC events for unmatched CIs
  ansible.builtin.uri:
    url: "{{ sn_url }}/api/now/table/sys_properties/{{ sn_unmatched_ci_prop.json.result[0].sys_id }}"
    method: PUT
    url_username: "{{ sn_user }}"
    url_password: "{{ sn_password }}"
    force_basic_auth: true
    headers: "{{ sn_api_headers }}"
    body_format: json
    body:
      value: "true"
    status_code: [200]
  when:
    - sn_unmatched_ci_prop.json.result | default([]) | length > 0
    - (sn_unmatched_ci_prop.json.result[0].value | default('false') | lower) != 'true'
  delegate_to: localhost
  run_once: true

- name: Show unmatched-CI events property
  ansible.builtin.debug:
    msg: >-
      sn_dynatrace_integ.events_for_unmatched_ci.enabled =>
      {{ sn_unmatched_ci_prop.json.result[0].value | default('missing') }}
      (set true so problems without topology CI match still create em_events;
      lab BRs bind via spark.service_instance / spark.pod_identifier / HOST).
  when: sn_unmatched_ci_prop.json.result | default([]) | length > 0
  run_once: true
