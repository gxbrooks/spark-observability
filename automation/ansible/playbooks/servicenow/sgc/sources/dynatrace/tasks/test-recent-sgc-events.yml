---
# The events test checks, shared by events/test.yml (fails) and
# events/diagnose.yml (applied with ignore_errors, so diagnose reports and
# carries on): recent Processed/Ready em_event rows from the SGO-Dynatrace
# source. Expects check-sgc-prerequisites.yml to have run (sn_sgc_scope_present).
- name: Query em_event in last 2 hours
  ansible.builtin.include_tasks: "{{ sn_discovery_tasks_dir }}/sn-rest-get.yml"
  vars:
    sn_rest_table: em_event
    sn_rest_query: >-
      sysparm_query=source={{ sn_sgc_event_source }}^sys_created_on>javascript:gs.hoursAgo(2)^ORDERBYDESCsys_created_on&sysparm_fields=number,source,severity,state,description,type,sys_created_on,cmdb_ci&sysparm_limit=20

- name: Skip assertions when em_event table is not readable
  ansible.builtin.debug:
    msg: >-
      Cannot read em_event (HTTP {{ sn_rest_status }}). Grant evt_mgmt_admin to {{ sn_user }}
      or verify events in ServiceNow → Event Management → All Events.
  when: sn_rest_status | default(0) != 200

- name: Assert at least one recent SGC Dynatrace event exists
  ansible.builtin.assert:
    that:
      - sn_rest_json.result | default([]) | length > 0
      - sn_rest_json.result | selectattr('source', 'equalto', sn_sgc_event_source) | list | length > 0
      - sn_rest_json.result | selectattr('source', 'equalto', sn_sgc_event_source) | selectattr('state', 'in', ['Ready', 'Processed']) | list | length > 0
    fail_msg: >-
      No Processed/Ready em_event rows from {{ sn_sgc_event_source }} in the last 2 hours.
      Run events/deploy.yml (SGC payload template), generate CPU or ERROR problems, then re-test.
    success_msg: >-
      Found {{ sn_rest_json.result | selectattr('source', 'equalto', sn_sgc_event_source) | list | length }}
      recent {{ sn_sgc_event_source }} event(s).
  when:
    - sn_rest_status | default(0) == 200
    - sn_sgc_scope_present | default(false) | bool

- name: Fail when SGC is not installed (brooks-lab uses only the SGO-Dynatrace push connector)
  ansible.builtin.fail:
    msg: >-
      SGC ({{ sn_sgc_app_scope }}) is not installed on {{ sn_url }}; brooks-lab events
      arrive only through its OOTB SGO-Dynatrace push connector. Run servicenow/sgc/install.yml.
  when: not (sn_sgc_scope_present | default(false) | bool)
