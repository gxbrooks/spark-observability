---
# Shared ServiceNow SGC / event integration variables.
#
# Context variables (UPPERCASE) come ONLY from the generated context files
# (vars/contexts/servicenow_ansible_vars.yml, dynatrace_ansible_vars.yml).
# The single source of truth is vars/variables.yaml — do NOT add default(...)
# fallbacks for context variables here; a missing variable must fail the play.
# Secrets: vars/secrets.yaml (servicenow: block).

# ServiceNow target: ONE instance per run (-e target=<id>, ids in SN_INSTANCES).
# tasks/target.yml resolves it — default: the active instance, derived from
# the live MID Server / KVA informer / Dynatrace notifications (nothing is
# recorded) — and publishes it to every host as sn_target_resolved.
# Registry: SN_INSTANCES in vars/variables.yaml. Secrets: servicenow.<KEY><secrets_suffix>.
# See specifications/servicenow/docs/Multi_Target_ServiceNow.md.
sn_target: "{{ sn_target_resolved | default(target) }}"
sn_instance_id: "{{ sn_target }}"
sn_instance_cfg: "{{ SN_INSTANCES | selectattr('id', 'equalto', sn_instance_id) | first }}"
sn_secret_suffix: "{{ sn_instance_cfg.secrets_suffix | default('') }}"
sn_url: "{{ sn_instance_cfg.url | trim }}"
sn_user: "{{ (servicenow | default({}))['SN_USER' ~ sn_secret_suffix] | default(lookup('vars', 'SN_USER' ~ sn_secret_suffix)) }}"
sn_password: "{{ (servicenow | default({}))['SN_PASSWORD' ~ sn_secret_suffix] | default(lookup('vars', 'SN_PASSWORD' ~ sn_secret_suffix)) }}"
sn_instance_short_name: "{{ sn_instance_cfg.short_name }}"
sn_lab_location_name: "{{ SN_LAB_LOCATION_NAME }}"

sn_api_headers:
  Accept: application/json
  Content-Type: application/json

# Directory anchors — valid from sgc/, sgc/sources/<source>/ and deeper.
sn_sgc_dir: "{{ playbook_dir | regex_replace('^(.*/sgc)(/.*)?$', '\\1') }}"
sn_servicenow_playbooks_dir: "{{ sn_sgc_dir | dirname }}"
sn_dynatrace_source_dir: "{{ sn_sgc_dir }}/sources/dynatrace"
sn_repo_root: "{{ project_root }}"
sn_discovery_tasks_dir: "{{ playbook_dir | regex_replace('/automation/ansible/playbooks/.*$', '') }}/automation/ansible/playbooks/servicenow/discovery/tasks"
sn_specs_root: "{{ sn_specs_root_override | default(sn_repo_root ~ '/specifications/servicenow') }}"
sn_integrations_dir: "{{ sn_specs_root }}/integrations"

# Required Store applications and plugins: specifications/servicenow/integrations/sgc/store_apps.yml
# (sn_store_apps), loaded via vars_files by install.yml and diagnose.yml.

# SGC (2nd gen Observability connector)
sn_sgc_app_scope: sn_dynatrace_integ
sn_sgc_discovery_source: SGO-Dynatrace
sn_sgc_event_source: SGO-Dynatrace

# brooks-lab posts Dynatrace problems ONLY to the OOTB SGC push connector
# "Dynatrace Observability" (sn_em_connector_listener, source SGO-Dynatrace,
# sys_id b70d280e07032010b1306a77c4a9355e on every instance with SGC). The
# legacy "Dynatrace Monitor Push Connector" (source=dynatrace) and the
# instance-specific legacy connector instances belong to other teams'
# notifications and are not used.
sn_dt_event_inbound_url_sgc: >-
  {{ sn_url }}/api/sn_em_connector/em/inbound_event?source={{ sn_sgc_event_source }}

# SGO-Dynatrace webhook Basic auth (ensure-sn-dt-webhook-auth.yml → secrets.yaml SN_DT_WEBHOOK_*)

# Dynatrace API (resolved in observability/dynatrace/tasks/resolve_dt_api.yml)
dt_api_url_resolved: ""
dt_api_token_resolved: ""
dt_management_zone_resolved: "{{ DT_MANAGEMENT_ZONE }}"
dt_management_zone_object_id: ""

# Dedicated Dynatrace token for the SGC connection (minted by
# sources/dynatrace/tasks/ensure-sgc-credential.yml via DT_TOKEN_ADMIN_TOKEN)
# One token per ServiceNow instance: a shared name would make a second instance
# skip minting (token "exists") and a rotation on one delete the other's token.
# The default instance keeps the original name.
dt_sgc_api_token_name: "{{ sn_instance_cfg.dt_sgc_api_token_name }}"

# SGC credential rotation (sources/dynatrace/tasks/check-sgc-token-remint-needed.yml)
sgc_hosts_import_table: sn_dynatrace_integ_sg_dynatrace_hosts
sgc_auto_rotate_token: true

# SGO-Dynatrace Hosts scheduled import (sources/dynatrace/start.yml)
sgc_hosts_scheduled_import_name: SGO-Dynatrace Hosts
# Canonical recurring cadence for SGO-Dynatrace Hosts. Execute Now temporarily
# sets run_type=once; the "before" state is only a safe restore target when it
# is itself a real recurring cadence. If a prior run's restore step failed (or
# the row was already wedged at 'once' from a manual UI Execute Now), snapshotting
# 'once' as "before" and restoring it is a no-op that leaves the import
# permanently off ServiceNow's internal scheduler. Fall back to these values
# whenever the current run_type is not a genuine recurring cadence.
#
# 'periodically' (base sysauto run_type, confirmed via sys_choice name=sysauto)
# + run_period is used over 'daily' so topology (and therefore event CI binding)
# self-heals within an hour of a Dynatrace-side entity change (e.g. a Kubernetes
# Operator/Dynakube reinstall minting a new cluster entity id) instead of up to
# a full day.
sgc_hosts_scheduled_import_restore_run_type: periodically
sgc_hosts_scheduled_import_restore_run_period: "1970-01-01 01:00:00"

# SGO-Dynatrace Kubernetes Cluster scheduled import — not part of the Hosts
# cascade (its children are Kubernetes Node/Pod/Namespace, triggered off this
# parent, not off Hosts). Ensured active + hourly by apply-sgc-topology-config.yml
# so cluster-level topology (and therefore event CI binding for KUBERNETES_CLUSTER
# problems) re-syncs on its own after the Dynatrace-side entity ID changes.
sgc_kubernetes_cluster_scheduled_import_name: SGO-Dynatrace Kubernetes Cluster
sgc_kubernetes_cluster_scheduled_import_run_type: periodically
sgc_kubernetes_cluster_scheduled_import_run_period: "1970-01-01 01:00:00"
sgc_import_execute: true
sgc_import_monitor: true
sgc_import_skip_if_running: true
sgc_import_restore_schedule: true
sgc_import_start_offset_seconds: 30
sgc_import_queue_retries: 12
sgc_import_queue_delay: 10
sgc_import_poll_interval: 300
sgc_import_poll_retries: 12
sgc_import_lab_feeds:
  - sn_dynatrace_integ_sg_dynatrace_hosts
  - sn_dynatrace_integ_sg_dynatrace_processes
  - sn_dynatrace_integ_sg_dynatrace_process_groups
  - sn_dynatrace_integ_sg_dynatrace_services
  - sn_dynatrace_integ_sg_dynatrace_applications
  - sn_dynatrace_integ_sg_dynatrace_application_relationships
  - sn_dynatrace_integ_sgo_dynatrace_kubernetes_cluster
  - sn_dynatrace_integ_sgo_dynatrace_kubernetes_node
  - sn_dynatrace_integ_sgo_dynatrace_kubernetes_pod
  - sn_dynatrace_integ_sgo_dynatrace_kubernetes_namespace
  - sn_dynatrace_integ_sgo_dynatrace_custom_applications

# Lab alerting / notification object names (idempotent upsert keys)
# dt_sn_alerting_profile_name and dt_sn_spark_error_log_event_summary come from
# vars/variables.yaml (single source for Ansible and Terraform) via dynatrace_ansible_vars.yml,
# loaded earlier in this playbook's vars_files. See vars/README.md.
dt_sn_alerting_profile_name: "{{ DT_SN_ALERTING_PROFILE_NAME }}"
dt_sn_problem_notification_name: "{{ sn_instance_cfg.dt_problem_notification_name }}"
dt_sn_cpu_metric_event_summary: "{{ DT_SN_CPU_METRIC_EVENT_SUMMARY }}"
dt_sn_cpu_metric_event_summary_legacy: "Spark Lab - Host CPU above 80%"
dt_sn_cpu_metric_event_host_names:
  - lab1
  - lab2
  - lab3
dt_sn_spark_error_log_event_summary: "{{ DT_SN_SPARK_ERROR_LOG_EVENT_SUMMARY }}"
# ---------------------------------------------------------------------------
# L2I patterns (Spark-independent)
#   1) Standalone App with short Log4j2 logs  — custom log source + service_instance
#   2) K8s App with short Log4j2 logs         — Container Output + k8s.pod.name
# Attributes we introduce use the log.* basename (log.class, log.line, log.event_kind).
# event.type stays the Dynatrace Davis enum; log.event_kind is the SN semantic remap.
# Clustering / AMR tags: log.signature, l2i.environment, l2i.service_instance.
# ---------------------------------------------------------------------------
# Prevents TBAC / Davis correlation across environments (lab vs prod, etc.).
# dt_l2i_environment and the four openpipeline display_name/custom_id vars come from
# vars/variables.yaml (single source for Ansible and Terraform) via dynatrace_ansible_vars.yml,
# loaded earlier in this playbook's vars_files. See vars/README.md.
dt_l2i_environment: "{{ DT_ENVIRONMENT }}"
dt_l2i_standalone_custom_source_name: "Standalone short Log4j2 - application log files"
dt_l2i_standalone_service_instance: "{{ DT_L2I_STANDALONE_SERVICE_INSTANCE }}"
dt_l2i_standalone_log_path_pattern: "{{ DT_L2I_STANDALONE_LOG_PATH_PATTERN }}"
dt_l2i_standalone_log_path_pattern_rotated: "{{ DT_L2I_STANDALONE_LOG_PATH_PATTERN_ROTATED }}"
dt_l2i_standalone_log_source_glob: "/mnt/spark/client-logs/*"
dt_l2i_standalone_openpipeline_display_name: "{{ DT_L2I_STANDALONE_OPENPIPELINE_DISPLAY_NAME }}"
dt_l2i_standalone_openpipeline_custom_id: "{{ DT_L2I_STANDALONE_OPENPIPELINE_CUSTOM_ID }}"
dt_l2i_standalone_routing_description: "Standalone short Log4j2 log alerts (custom log source)"

dt_l2i_k8s_namespace: "spark"
dt_l2i_k8s_openpipeline_display_name: "{{ DT_L2I_K8S_OPENPIPELINE_DISPLAY_NAME }}"
dt_l2i_k8s_openpipeline_custom_id: "{{ DT_L2I_K8S_OPENPIPELINE_CUSTOM_ID }}"
dt_l2i_k8s_routing_description: "K8s short Log4j2 log alerts (Container Output)"

# eShop .NET services (namespace eshop): single-line simple console logs.
dt_eshop_k8s_namespace: "eshop"
dt_eshop_openpipeline_display_name: "{{ DT_ESHOP_OPENPIPELINE_DISPLAY_NAME }}"
dt_eshop_openpipeline_custom_id: "{{ DT_ESHOP_OPENPIPELINE_CUSTOM_ID }}"
dt_eshop_routing_description: "eShop .NET log alerts (Container Output ns=eshop)"

# Prior route descriptions removed from routing on apply (idempotent cleanup)
dt_l2i_routing_description_legacy:
  - "Spark Lab log alerts (ERROR/WARN)"
  - "Spark Lab Client log alerts (/mnt/spark/client-logs)"
  - "Spark Lab Cluster log alerts (Container Output ns=spark)"

# ---------------------------------------------------------------------------
# SGC for Observability - Dynatrace SaaS (sn_dynatrace_saas; sources/dynatrace-saas/)
# Reads the Dynatrace 3rd-gen platform (Smartscape on Grail) with DQL through a
# platform token. brooks-lab owns the app's default connection ("Dynatrace SaaS");
# connections other people added in SGC Central (their own aliases) are not touched.
# ---------------------------------------------------------------------------
sgc_saas_app_scope: sn_dynatrace_saas
sgc_saas_discovery_source: SGO-Dynatrace SaaS
sgc_saas_connection_alias_id: sn_dynatrace_saas.Dynatrace_SaaS
sgc_saas_tenant_url: "{{ DT_TENANT_URL | regex_replace('/+$', '') }}"
# Secret (vars/secrets.yaml): dynatrace.DT_PLATFORM_TOKEN_SGC_SAAS — a platform token
# with storage:smartscape:read (the connector only runs smartscapeNodes/Edges DQL).
sgc_saas_token_secret_key: DT_PLATFORM_TOKEN_SGC_SAAS
# Write the token into the connection credential even when the connection reports Success.
sgc_saas_rotate_credential: false
# Root scheduled imports of the default connection; every other SaaS import runs after a parent.
sgc_saas_root_imports:
  - SGO-Dynatrace SaaS Host
  - SGO-Dynatrace SaaS K8s Cluster
sgc_saas_import_run_type: periodically
sgc_saas_import_run_period: "1970-01-01 01:00:00"
# Connection properties (sn_cmdb_int_util_service_graph_connection_property). segment_id
# empty = the whole tenant (no brooks-lab Dynatrace segment exists yet).
sgc_saas_connection_properties:
  segment_id: ""
  append_tenant_id_to_service_name: "false"
  service_to_service_relationships_enabled: "true"
# start.yml monitor: wait up to this many seconds for each root import to finish.
sgc_saas_import_wait_seconds: 1800

# Legacy SGC (sn_dynatrace_integ) topology imports that sources/dynatrace/stop.yml disables.
# The legacy app stays installed: its push listener "Dynatrace Observability"
# (source SGO-Dynatrace) still receives Dynatrace problem events.
sgc_legacy_root_imports:
  - SGO-Dynatrace Hosts
  - SGO-Dynatrace Kubernetes Cluster

# Other people's SGC for Dynatrace SaaS connections that import the brooks-lab tenant and are not
# used by brooks-lab. sources/dynatrace-saas/deploy.yml deactivates each one: the service graph
# connection and every scheduled import named "<connection> - ..." (its cloned schedule set).
# Reversible: set active=true again on those records (SGC Central or the Table API).
sgc_saas_deactivate_connections:
  - Dynatrace - Katie
