---
# Phase 2: Deploy ServiceNow KVA instance configuration (cluster location + inheritance BR).
# Usage: ansible-playbook -i inventory.yml playbooks/servicenow/discovery/k8s/deploy.yml -e @../vars/secrets.yaml
#
# Prerequisite: k8s/install.yml and KVA full discovery (cluster CI exists in CMDB).

- import_playbook: ../../tasks/target.yml
  vars:
    sn_target_playbook: discovery/k8s/deploy.yml
    sn_target_mode: switch

- name: Read the brooks-lab cluster UID
  hosts: kubernetes_master
  gather_facts: false
  tasks:
    - name: Read the uid of namespace kube-system (the cluster UID KVA and SGC report)
      ansible.builtin.command: kubectl get namespace kube-system -o jsonpath={.metadata.uid}
      register: sn_k8s_cluster_uid_read
      changed_when: false

    - name: Publish the cluster UID to localhost
      ansible.builtin.set_fact:
        sn_k8s_cluster_uid: "{{ sn_k8s_cluster_uid_read.stdout | trim }}"
      delegate_to: localhost
      delegate_facts: true

- name: Deploy ServiceNow KVA location configuration
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ project_root }}/vars/contexts/servicenow_ansible_vars.yml"
    - "{{ project_root }}/vars/secrets.yaml"
    - "{{ playbook_dir }}/../common/vars.yml"
  tasks:
    - name: Give the cluster CI both identifiers (KVA k8s_uid, SGC cluster_resource_id)
      ansible.builtin.include_tasks: tasks/align-k8s-cluster-identifiers.yml

    - name: Set location on Kubernetes cluster CIs from cluster-to-location map
      ansible.builtin.include_tasks: tasks/set-k8s-cluster-locations.yml

    - name: Ensure Kubernetes location inheritance business rule
      ansible.builtin.include_tasks: tasks/ensure-k8s-location-business-rule.yml

    - name: Persist K8s deploy context
      ansible.builtin.copy:
        dest: "{{ project_root }}/vars/contexts/servicenow_k8s_discovery_deploy{{ sn_context_suffix }}.json"
        mode: "0644"
        content: >-
          {{ {
            'kva_clusters': k8s_kva_clusters | map(attribute='name') | list,
            'location_business_rule': sn_k8s_location_br_body.name
          } | to_nice_json }}
      delegate_to: localhost
      become: false

    - name: Deploy summary
      ansible.builtin.debug:
        msg: |
          KVA instance configuration complete for {{ k8s_clusters | length }} cluster(s) in K8S_CLUSTERS.
          kva_informer-enabled: {{ k8s_kva_clusters | map(attribute='name') | list }}
          Business rule: {{ sn_k8s_location_br_body.name }}
          All brooks-lab CIs: {{ sn_cmdb_all_cis_url }}
