---
# Product-native step 2: business rule on cmdb_ci_kubernetes_component inherits
# cluster.location to child CIs when KVA Informer inserts/updates without location.
# Representation: specifications/servicenow/integrations/discovery/k8s_inherit_location_from_cluster.br.json
# (record fields) + k8s_inherit_location_from_cluster.br.js (script source).

- name: Load K8s location inheritance business rule representation
  ansible.builtin.set_fact:
    sn_k8s_location_br_body: >-
      {{ lookup('file', sn_discovery_integrations_dir + '/k8s_inherit_location_from_cluster.br.json') | from_json
         | combine({'script': lookup('file', sn_discovery_integrations_dir + '/k8s_inherit_location_from_cluster.br.js')}) }}

- name: Look up K8s location inheritance business rule
  ansible.builtin.include_tasks: "{{ sn_discovery_tasks_dir }}/sn-rest-get.yml"
  vars:
    sn_rest_table: sys_script
    sn_rest_query: "sysparm_query=name={{ sn_k8s_location_br_body.name | urlencode }}&sysparm_limit=1"

- name: Record whether K8s location business rule exists
  ansible.builtin.set_fact:
    sn_k8s_location_br_exists: "{{ (sn_rest_json.result | default([]) | length) > 0 }}"
    sn_k8s_location_br_sys_id: "{{ sn_rest_json.result[0].sys_id | default('') }}"

- name: Create K8s location inheritance business rule
  ansible.builtin.include_tasks: "{{ sn_discovery_tasks_dir }}/sn-rest-mutate.yml"
  vars:
    sn_rest_method: post
    sn_rest_table: sys_script
    sn_rest_body: "{{ sn_k8s_location_br_body }}"
  when: not sn_k8s_location_br_exists | bool

- name: Compare the live record with its representation
  ansible.builtin.include_tasks: "{{ sn_discovery_tasks_dir | dirname | dirname }}/tasks/record-drift.yml"
  vars:
    sn_drift_wanted: "{{ sn_k8s_location_br_body }}"
    sn_drift_live: "{{ sn_rest_json.result[0] }}"
  when: sn_k8s_location_br_exists | bool

- name: Update K8s location inheritance business rule
  ansible.builtin.include_tasks: "{{ sn_discovery_tasks_dir }}/sn-rest-mutate.yml"
  vars:
    sn_rest_method: patch
    sn_rest_table: sys_script
    sn_rest_sys_id: "{{ sn_k8s_location_br_sys_id }}"
    sn_rest_body: "{{ sn_k8s_location_br_body }}"
  when:
    - sn_k8s_location_br_exists | bool
    - sn_drift_fields | length > 0

- name: K8s location business rule summary
  ansible.builtin.debug:
    msg: >-
      Business rule '{{ sn_k8s_location_br_body.name }}' active on cmdb_ci_kubernetes_component.
      Child K8s CIs inherit location from their cluster CI when KVA leaves location empty.
