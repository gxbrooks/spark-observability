---
# Apply per-node servicenow.com/service-instance to OneAgent pods (imported by
# discovery/k8s/start.yml).
- name: Label OneAgent pods
  hosts: kubernetes_master
  become: true
  gather_facts: false
  tasks:
    - name: Label OneAgent pod on each node
      ansible.builtin.include_tasks: "{{ project_root }}/automation/ansible/playbooks/observability/dynatrace/tasks/label_oneagent_servicenow.yml"
      loop: "{{ groups['k8s_nodes'] | default([]) }}"
      loop_control:
        loop_var: oneagent_node
        label: "{{ oneagent_node }}"
