---
# Ensure instance business rule: docker containers inherit host.location.
# Representation: specifications/servicenow/integrations/discovery/docker_inherit_location_from_host.br.json
# (record fields) + docker_inherit_location_from_host.br.js (script source).

- name: Load Docker location inheritance business rule representation
  ansible.builtin.set_fact:
    sn_docker_location_br_body: >-
      {{ lookup('file', sn_discovery_integrations_dir + '/docker_inherit_location_from_host.br.json') | from_json
         | combine({'script': lookup('file', sn_discovery_integrations_dir + '/docker_inherit_location_from_host.br.js')}) }}

- name: Look up Docker location inheritance business rule
  ansible.builtin.include_tasks: "{{ sn_discovery_tasks_dir }}/sn-rest-get.yml"
  vars:
    sn_rest_table: sys_script
    sn_rest_query: "sysparm_query=name={{ sn_docker_location_br_body.name | urlencode }}&sysparm_limit=1"

- name: Record whether Docker location business rule exists
  ansible.builtin.set_fact:
    sn_docker_location_br_exists: "{{ (sn_rest_json.result | default([]) | length) > 0 }}"
    sn_docker_location_br_sys_id: "{{ sn_rest_json.result[0].sys_id | default('') }}"

- name: Create Docker location inheritance business rule
  ansible.builtin.include_tasks: "{{ sn_discovery_tasks_dir }}/sn-rest-mutate.yml"
  vars:
    sn_rest_method: post
    sn_rest_table: sys_script
    sn_rest_body: "{{ sn_docker_location_br_body }}"
  when: not sn_docker_location_br_exists | bool

- name: Compare the live record with its representation
  ansible.builtin.include_tasks: "{{ sn_discovery_tasks_dir | dirname | dirname }}/tasks/record-drift.yml"
  vars:
    sn_drift_wanted: "{{ sn_docker_location_br_body }}"
    sn_drift_live: "{{ sn_rest_json.result[0] }}"
  when: sn_docker_location_br_exists | bool

- name: Update Docker location inheritance business rule
  ansible.builtin.include_tasks: "{{ sn_discovery_tasks_dir }}/sn-rest-mutate.yml"
  vars:
    sn_rest_method: patch
    sn_rest_table: sys_script
    sn_rest_sys_id: "{{ sn_docker_location_br_sys_id }}"
    sn_rest_body: "{{ sn_docker_location_br_body }}"
  when:
    - sn_docker_location_br_exists | bool

    - sn_drift_fields | length > 0