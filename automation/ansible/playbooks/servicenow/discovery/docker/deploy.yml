---
# Phase 3: Docker instance configuration (location inheritance business rule).
# Usage: ansible-playbook -i inventory.yml playbooks/servicenow/discovery/docker/deploy.yml -e @../vars/secrets.yaml

- import_playbook: ../../tasks/target.yml
  vars:
    sn_target_playbook: discovery/docker/deploy.yml
    sn_target_mode: switch

- name: Deploy ServiceNow Docker discovery configuration
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ project_root }}/vars/contexts/servicenow_ansible_vars.yml"
    - "{{ project_root }}/vars/secrets.yaml"
    - "{{ playbook_dir }}/../common/vars.yml"
  tasks:
    - name: Ensure Docker location inheritance business rule
      ansible.builtin.include_tasks: tasks/ensure-docker-location-business-rule.yml

    - name: Deploy summary
      ansible.builtin.debug:
        msg: |
          Docker discovery configuration complete.
          DOCKER_HOSTS entries: {{ docker_hosts | map(attribute='name') | list }}
          container_discovery-enabled: {{ docker_discovery_hosts | map(attribute='name') | list }}
          Business rule: {{ sn_docker_location_br_body.name }}
