---
# Install ServiceNow Discovery prerequisites on lab hosts.
# Usage: ansible-playbook -i inventory.yml playbooks/servicenow/discovery/install.yml -e @../vars/secrets.yaml

- name: Generate SSH key pair for Discovery credential
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [discovery_user, mid_server, always]
  vars_files:
    - "{{ project_root }}/vars/contexts/servicenow_ansible_vars.yml"
    - "{{ playbook_dir }}/common/vars.yml"
  tasks:
    - name: Regenerate service-now context when stale
      ansible.builtin.include_tasks: tasks/regenerate-context.yml

    - name: Ensure vars directory exists
      ansible.builtin.file:
        path: "{{ project_root }}/vars"
        state: directory
        mode: "0755"

    - name: Generate sn-discovery ed25519 key when missing
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -N "" -f {{ sn_discovery_ssh_private_key_path }}
        creates: "{{ sn_discovery_ssh_private_key_path }}"

- name: Install sn-discovery account on Kubernetes nodes
  hosts: k8s_nodes
  become: true
  gather_facts: true
  vars_files:
    - "{{ project_root }}/vars/contexts/servicenow_ansible_vars.yml"
    - "{{ playbook_dir }}/common/vars.yml"
  tasks:
    - name: Install discovery user and sudoers
      ansible.builtin.include_tasks:
        file: tasks/install_discovery_user.yml
        apply:
          tags: [discovery_user]
      tags: [discovery_user]

- name: Install sn-discovery Docker Pattern permissions on Docker hosts
  # hosts: is resolved before ANY variable loading for this play -- not
  # just vars_files, but group_vars too (Ansible must know which hosts a
  # play targets before it can load per-host variables, so group_vars/all
  # isn't available here either). This is the one place in the tree that
  # genuinely cannot use {{ project_root }}; playbook_dir is a magic
  # variable resolvable with no variable-loading step at all, so it's the
  # only thing that works here. Pre-existing Ansible limitation, confirmed
  # identical on the pre-restructuring tree, not introduced by this change.
  hosts: "{{ (lookup('file', playbook_dir ~ '/../../../../../vars/contexts/servicenow_ansible_vars.yml') | from_yaml).DOCKER_HOSTS | selectattr('discovery_docker_pattern', 'defined') | selectattr('discovery_docker_pattern') | map(attribute='ansible_host') | unique | list }}"
  become: true
  gather_facts: false
  vars_files:
    - "{{ project_root }}/vars/contexts/servicenow_ansible_vars.yml"
    - "{{ playbook_dir }}/common/vars.yml"
  tasks:
    - name: Install Docker Pattern permissions for sn-discovery
      ansible.builtin.include_tasks:
        file: tasks/install_discovery_docker.yml
        apply:
          tags: [discovery_user]
      tags: [discovery_user]

- name: Install ServiceNow MID Server on Lab3
  hosts: observability
  become: true
  gather_facts: true
  vars_files:
    - "{{ project_root }}/vars/contexts/servicenow_ansible_vars.yml"
    - "{{ project_root }}/vars/secrets.yaml"
    - "{{ playbook_dir }}/common/vars.yml"
  tasks:
    - name: Install MID Server
      ansible.builtin.include_tasks:
        file: tasks/install_mid_server.yml
        apply:
          tags: [mid_server]
      when: observability_host | default('Lab3') == inventory_hostname
      tags: [mid_server]
