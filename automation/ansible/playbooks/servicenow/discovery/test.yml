---
# Assert brooks-lab Linux servers appear in CMDB after Discovery.
# Usage: ansible-playbook -i inventory.yml playbooks/servicenow/discovery/test.yml -e @../vars/secrets.yaml

- import_playbook: ../tasks/target.yml
  vars:
    sn_target_playbook: discovery/test.yml
    sn_target_mode: active

- name: Test CMDB for brooks-lab discovered hosts
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ project_root }}/vars/contexts/servicenow_ansible_vars.yml"
    - "{{ project_root }}/vars/secrets.yaml"
    - "{{ playbook_dir }}/common/vars.yml"
  tasks:
    - name: Assert the lab hosts were discovered
      ansible.builtin.include_tasks: tasks/test-discovered-hosts.yml
