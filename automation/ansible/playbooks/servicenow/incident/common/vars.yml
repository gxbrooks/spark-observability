---
# Log-to-Incident orchestration variables (lookup keys and shared overrides).
# Desired-state payloads live under specifications/servicenow/integrations/incident/.

sn_repo_root: "{{ project_root }}"
sn_discovery_tasks_dir: "{{ playbook_dir | regex_replace('/automation/ansible/playbooks/.*$', '') }}/automation/ansible/playbooks/servicenow/discovery/tasks"
sn_incident_integrations_dir: "{{ sn_repo_root }}/specifications/servicenow/integrations/incident"

# ServiceNow target: ONE instance per run (-e target=<id>, ids in SN_INSTANCES).
# tasks/target.yml resolves it — default: the active instance, derived from
# the live MID Server / KVA informer / Dynatrace notifications (nothing is
# recorded) — and publishes it to every host as sn_target_resolved.
# Registry: SN_INSTANCES in vars/variables.yaml. Secrets: servicenow.<KEY><secrets_suffix>.
# See specifications/servicenow/docs/Multi_Target_ServiceNow.md.
sn_target: "{{ sn_target_resolved | default(target) }}"
sn_instance_id: "{{ sn_target }}"
sn_instance_cfg: "{{ SN_INSTANCES | selectattr('id', 'equalto', sn_instance_id) | first }}"
sn_secret_suffix: "{{ sn_instance_cfg.secrets_suffix | default('') }}"
sn_url: "{{ sn_instance_cfg.url | trim }}"
sn_user: "{{ (servicenow | default({}))['SN_USER' ~ sn_secret_suffix] | default(lookup('vars', 'SN_USER' ~ sn_secret_suffix)) }}"
sn_password: "{{ (servicenow | default({}))['SN_PASSWORD' ~ sn_secret_suffix] | default(lookup('vars', 'SN_PASSWORD' ~ sn_secret_suffix)) }}"
sn_instance_short_name: "{{ sn_instance_cfg.short_name }}"
sn_api_headers:
  Accept: application/json
  Content-Type: application/json

sn_incident_si_name: ResolveApplicationService

# Shared instantiation for AMR filter representations.
sn_incident_max_severity: "3"

# OOTB lookup keys (product-owned rows).
sn_sgo_ootb_amr_name: SGO-Dynatrace
sn_sgo_ootb_amr_sys_id: 7f5e284e07032010b1306a77c4a93523
sn_sgo_dt_alert_subflow_sys_id: 21b17cce07032010b1306a77c4a93506
sn_l2i_ootb_primary_amr_name: Create Incident for Primary Alert
sn_l2i_ootb_primary_amr_sys_id: ca7568539f533300b9a491aec32e7040
sn_l2i_create_incident_subflow_name: Create Incident
sn_l2i_create_incident_subflow_sys_id: 45454f6193330300415c74aff67ffbfb
sn_ootb_ci_in_change_window_rule_name: CI in Change Window

# Product-generated TBAC correlation rule name (lookup only).
sn_l2i_tbac_correlation_rule_name: "[Tag Based] L2I short Log4j2 SI + signature"
sn_metric_class_tbac_correlation_rule_name: "[Tag Based] L2I metric_class CPU cluster"
