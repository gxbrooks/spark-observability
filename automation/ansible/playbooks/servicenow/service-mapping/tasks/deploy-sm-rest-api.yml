    sn_rest_table: sys_ws_operation
    sn_rest_sys_id: "{{ sn_sm_populate_tags_op_rows[0].sys_id }}"
    sn_rest_body:
      operation_script: "{{ sn_sm_rest_populate_tags_script }}"
      active: "{{ sn_sm_rest_populate_tags_op.active }}"
  when:
    - sn_sm_populate_tags_op_rows | length > 0
    - sn_sm_populate_tags_op_rows[0].operation_script | default('') != sn_sm_rest_populate_tags_script

- name: Refresh Service Mapping populate_tags operation URI
  ansible.builtin.include_tasks: "{{ sn_discovery_tasks_dir }}/sn-rest-get.yml"
  vars:
    sn_rest_table: sys_ws_operation
    sn_rest_query: >-
      sysparm_query=web_service_definition={{ sn_sm_rest_ws_sys_id }}^http_method={{ sn_sm_rest_populate_tags_op.http_method }}^relative_path={{
      sn_sm_rest_populate_tags_op.relative_path | urlencode }}&sysparm_fields=operation_uri&sysparm_limit=1

- name: Record Service Mapping populate_tags REST URI
  ansible.builtin.set_fact:
    sn_sm_rest_populate_tags_uri: "{{ sn_rest_json.result[0].operation_uri }}"
  when: sn_rest_json.result | default([]) | length > 0

- name: Look up Service Mapping ensure_tag_categories REST operation
  ansible.builtin.include_tasks: "{{ sn_discovery_tasks_dir }}/sn-rest-get.yml"
  vars:
    sn_rest_table: sys_ws_operation
