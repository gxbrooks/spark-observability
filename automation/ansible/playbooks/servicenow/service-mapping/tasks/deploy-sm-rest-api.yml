      sn_sm_rest_ensure_tag_categories_op.relative_path | urlencode }}&sysparm_fields=sys_id,operation_uri,operation_script&sysparm_limit=1

- name: Cache ensure_tag_categories operation lookup
  ansible.builtin.set_fact:
