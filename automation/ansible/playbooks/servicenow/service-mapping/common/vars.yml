---
# Shared Service Mapping install variables.
# Context variables come from vars/contexts/servicenow_ansible_vars.yml; secrets
# from vars/secrets.yaml.

# ServiceNow target: -e target=<id>|all (default SN_DEFAULT_TARGET). With `all`,
# this process runs the first SN_INSTANCES entry and common/target.yml runs the
# rest as child runs, so sn_instance_id is always one instance id here.
# Registry: SN_INSTANCES in vars/variables.yaml. Secrets: servicenow.<KEY><secrets_suffix>.
# See specifications/servicenow/docs/Multi_Instance_Plan.md.
sn_target: "{{ target | default(SN_DEFAULT_TARGET) }}"
sn_instance_id: "{{ (SN_INSTANCES | first).id if sn_target == 'all' else sn_target }}"
sn_instance_cfg: "{{ SN_INSTANCES | selectattr('id', 'equalto', sn_instance_id) | first }}"
sn_secret_suffix: "{{ sn_instance_cfg.secrets_suffix | default('') }}"
sn_url: "{{ sn_instance_cfg.url | trim }}"
sn_user: "{{ (servicenow | default({}))['SN_USER' ~ sn_secret_suffix] | default(lookup('vars', 'SN_USER' ~ sn_secret_suffix)) }}"
sn_password: "{{ (servicenow | default({}))['SN_PASSWORD' ~ sn_secret_suffix] | default(lookup('vars', 'SN_PASSWORD' ~ sn_secret_suffix)) }}"
sn_instance_short_name: "{{ sn_instance_cfg.short_name }}"
# Per-instance suffix for vars/contexts/servicenow_*_deploy_<id>.json.
sn_context_suffix: "_{{ sn_instance_id }}"

sn_api_headers:
  Accept: application/json
  Content-Type: application/json

sn_sm_dir: "{{ playbook_dir | regex_replace('^(.*/service-mapping)(/.*)?$', '\\1') }}"
sn_sgc_dir: "{{ sn_sm_dir | dirname }}/sgc"
sn_servicenow_playbooks_dir: "{{ sn_sm_dir | dirname }}"
sn_repo_root: "{{ project_root }}"
sn_discovery_tasks_dir: "{{ playbook_dir | regex_replace('/automation/ansible/playbooks/.*$', '') }}/automation/ansible/playbooks/servicenow/discovery/tasks"
sn_sm_files_dir: "{{ sn_sm_dir | regex_replace('/automation/ansible/playbooks/.*$', '') }}/specifications/servicenow/integrations/service-mapping"
sn_sm_deploy_context_file: "{{ sn_sm_dir | regex_replace('/automation/ansible/playbooks/.*$', '') }}/vars/contexts/servicenow_sm_deploy{{ sn_context_suffix }}.json"

sn_sm_rest_api_name: Service Mapping Operations API
sn_sm_rest_discover_path: /discover
sn_sm_rest_populate_tags_path: /populate_tags
sn_sm_rest_ensure_tag_categories_path: /ensure_tag_categories

sn_csdm_tag_key_service_instance: servicenow.com/service-instance

sn_sm_configure_tag_categories: true
sn_sm_admin_role_candidates:
  - service_mapping_admin
  - itom_admin
  - sm_admin

# Default brooks-lab tag category keys (classic UI svc_tag_categories_list.do).
sn_sm_classic_tag_categories_url_suffix: svc_tag_categories_list.do
