---
# Extension of OOTB "CI in Change Window". That rule only marks
# change.cmdb_ci. This rule marks Affected CIs (task_ci.ci_item) for the
# same Scheduled/Implement planned window. Non-advanced — advanced
# findCisInMaint() return types are dropped by the calculator.
- name: Load Affected CIs maintenance rule representation
  ansible.builtin.set_fact:
    sn_affected_ci_maint_rule_body: "{{ lookup('file', sn_incident_integrations_dir + '/em_maintenance_rule_affected_cis.json') | from_json }}"

- name: Look up Affected CIs maintenance rule
  ansible.builtin.include_tasks: "{{ sn_discovery_tasks_dir }}/sn-rest-get.yml"
  vars:
    sn_rest_table: em_maintenance_rule
    sn_rest_query: "sysparm_query=name={{ sn_affected_ci_maint_rule_body.name | urlencode }}&sysparm_limit=1"

- name: Record Affected CIs maintenance rule state
  ansible.builtin.set_fact:
    sn_affected_ci_maint_exists: "{{ (sn_rest_json.result | default([]) | length) > 0 }}"
    sn_affected_ci_maint_sys_id: "{{ sn_rest_json.result[0].sys_id | default('') }}"

- name: Create Affected CIs maintenance rule
  ansible.builtin.include_tasks: "{{ sn_discovery_tasks_dir }}/sn-rest-mutate.yml"
  vars:
    sn_rest_method: post
    sn_rest_table: em_maintenance_rule
    sn_rest_body: "{{ sn_affected_ci_maint_rule_body }}"
  when: not sn_affected_ci_maint_exists | bool

- name: Update Affected CIs maintenance rule
  ansible.builtin.include_tasks: "{{ sn_discovery_tasks_dir }}/sn-rest-mutate.yml"
  vars:
    sn_rest_method: patch
    sn_rest_table: em_maintenance_rule
    sn_rest_sys_id: "{{ sn_affected_ci_maint_sys_id }}"
    sn_rest_body: "{{ sn_affected_ci_maint_rule_body }}"
  when:
    - sn_affected_ci_maint_exists | bool
    - sn_affected_ci_maint_sys_id | length > 0
