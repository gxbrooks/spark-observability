---
# Virtual Automated/Tag/CMDB groups use source=Group Alert. The SGO AMR
# does not match those rows. Payload:
# servicenow/integrations/incident/em_alert_management_rule_primary_alert.json
- name: Load Primary Alert AMR representation
  ansible.builtin.set_fact:
    sn_l2i_primary_amr_body: "{{ lookup('file', sn_incident_integrations_dir + '/em_alert_management_rule_primary_alert.json') | from_json }}"

- name: Look up Create Incident for Primary Alert AMRs
  ansible.builtin.include_tasks: "{{ sn_discovery_tasks_dir }}/sn-rest-get.yml"
  vars:
    sn_rest_table: em_alert_management_rule
    sn_rest_query: "sysparm_query=sys_id={{ sn_l2i_ootb_primary_amr_sys_id }}^ORname={{ sn_l2i_ootb_primary_amr_name | urlencode }}&sysparm_fields=sys_id,name,active,alert_filter&sysparm_limit=10"

- name: Record Primary Alert AMR rows
  ansible.builtin.set_fact:
    sn_l2i_primary_amr_rows: "{{ sn_rest_json.result | default([]) }}"

- name: Activate filtered Create Incident for Primary Alert
  ansible.builtin.include_tasks: "{{ sn_discovery_tasks_dir }}/sn-rest-mutate.yml"
  vars:
    sn_rest_method: patch
    sn_rest_table: em_alert_management_rule
    sn_rest_sys_id: "{{ sn_l2i_ootb_primary_amr_sys_id }}"
    sn_rest_body: "{{ sn_l2i_primary_amr_body }}"

- name: Collect extra Primary Alert AMR copies that are active
  ansible.builtin.set_fact:
    sn_l2i_primary_amr_extras: "{{ sn_l2i_primary_amr_rows | rejectattr('sys_id', 'equalto', sn_l2i_ootb_primary_amr_sys_id) | list }}"

- name: Deactivate extra Create Incident for Primary Alert copies
  ansible.builtin.include_tasks: "{{ sn_discovery_tasks_dir }}/sn-rest-mutate.yml"
  vars:
    sn_rest_method: patch
    sn_rest_table: em_alert_management_rule
    sn_rest_sys_id: "{{ item.sys_id }}"
    sn_rest_body:
      active: "false"
  loop: "{{ sn_l2i_primary_amr_extras }}"
  when:
    - item.active | default('') in ['true', '1', true, 1]
