---
# Upsert SGO-Dynatrace enrichment BRs.
# Before insert/update: stamp sn-impact/sn-urgency; log CI = service instance;
# else K8s dash-key CI. Alert enrich order 5000 so create BR (5020) sees stamps.

- name: Build em_event enrich SGO business rule payload
  ansible.builtin.set_fact:
    sn_l2i_enrich_event_br_body:
      name: "{{ sn_l2i_enrich_event_br_name }}"
      active: "true"
      collection: em_event
      advanced: "true"
      when: before
      action_insert: "true"
      action_update: "true"
      order: "{{ sn_l2i_enrich_event_br_order }}"
      filter_condition: source=SGO-Dynatrace
      description: >-
        Stamp sn-impact/sn-urgency (DT or ProblemSeverity mapping). Log events
        bind the service instance; infra events bind K8s dash-key CIs.
      script: "{{ lookup('file', sn_incident_integrations_dir + '/em_event_enrich_sgo.br.js') }}"

- name: Look up em_event enrich SGO business rule
  ansible.builtin.include_tasks: "{{ sn_discovery_common_dir }}/sn_rest_get.yml"
  vars:
    sn_rest_table: sys_script
    sn_rest_query: "sysparm_query=name={{ sn_l2i_enrich_event_br_name | urlencode }}&sysparm_limit=1"

- name: Record em_event enrich SGO business rule state
  ansible.builtin.set_fact:
    sn_l2i_enrich_event_br_exists: "{{ (sn_rest_json.result | default([]) | length) > 0 }}"
    sn_l2i_enrich_event_br_sys_id: "{{ sn_rest_json.result[0].sys_id | default('') }}"

- name: Create em_event enrich SGO business rule
  ansible.builtin.include_tasks: "{{ sn_discovery_common_dir }}/sn_rest_mutate.yml"
  vars:
    sn_rest_method: post
    sn_rest_table: sys_script
    sn_rest_body: "{{ sn_l2i_enrich_event_br_body }}"
  when: not sn_l2i_enrich_event_br_exists | bool

- name: Update em_event enrich SGO business rule
  ansible.builtin.include_tasks: "{{ sn_discovery_common_dir }}/sn_rest_mutate.yml"
  vars:
    sn_rest_method: patch
    sn_rest_table: sys_script
    sn_rest_sys_id: "{{ sn_l2i_enrich_event_br_sys_id }}"
    sn_rest_body: "{{ sn_l2i_enrich_event_br_body }}"
  when: sn_l2i_enrich_event_br_exists | bool

- name: Build em_alert enrich SGO business rule payload
  ansible.builtin.set_fact:
    sn_l2i_enrich_alert_br_body:
      name: "{{ sn_l2i_enrich_alert_br_name }}"
      active: "true"
      collection: em_alert
      advanced: "true"
      when: before
      action_insert: "true"
      action_update: "true"
      order: "{{ sn_l2i_enrich_alert_br_order }}"
      filter_condition: source=SGO-Dynatrace
      description: >-
        Stamp sn-impact/sn-urgency. Log alerts bind the service instance;
        infra alerts bind K8s dash-key CIs. Runs before create shim (5020).
      script: "{{ lookup('file', sn_incident_integrations_dir + '/em_alert_enrich_sgo.br.js') }}"

- name: Look up em_alert enrich SGO business rule
  ansible.builtin.include_tasks: "{{ sn_discovery_common_dir }}/sn_rest_get.yml"
  vars:
    sn_rest_table: sys_script
    sn_rest_query: "sysparm_query=name={{ sn_l2i_enrich_alert_br_name | urlencode }}&sysparm_limit=1"

- name: Record em_alert enrich SGO business rule state
  ansible.builtin.set_fact:
    sn_l2i_enrich_alert_br_exists: "{{ (sn_rest_json.result | default([]) | length) > 0 }}"
    sn_l2i_enrich_alert_br_sys_id: "{{ sn_rest_json.result[0].sys_id | default('') }}"

- name: Create em_alert enrich SGO business rule
  ansible.builtin.include_tasks: "{{ sn_discovery_common_dir }}/sn_rest_mutate.yml"
  vars:
    sn_rest_method: post
    sn_rest_table: sys_script
    sn_rest_body: "{{ sn_l2i_enrich_alert_br_body }}"
  when: not sn_l2i_enrich_alert_br_exists | bool

- name: Update em_alert enrich SGO business rule
  ansible.builtin.include_tasks: "{{ sn_discovery_common_dir }}/sn_rest_mutate.yml"
  vars:
    sn_rest_method: patch
    sn_rest_table: sys_script
    sn_rest_sys_id: "{{ sn_l2i_enrich_alert_br_sys_id }}"
    sn_rest_body: "{{ sn_l2i_enrich_alert_br_body }}"
  when: sn_l2i_enrich_alert_br_exists | bool
