---
# Keep the OOTB SGO-Dynatrace AMR inactive so it cannot create incidents
# before L2I enrich + EvtMgmtCustomIncidentPopulator run.

- name: Look up OOTB SGO-Dynatrace Alert Management Rule
  ansible.builtin.include_tasks: "{{ sn_discovery_common_dir }}/sn_rest_get.yml"
  vars:
    sn_rest_table: em_alert_management_rule
    sn_rest_query: "sysparm_query=sys_id={{ sn_sgo_ootb_amr_sys_id }}^ORname={{ sn_sgo_ootb_amr_name | urlencode }}&sysparm_fields=sys_id,name,active&sysparm_limit=5"

- name: Deactivate OOTB SGO-Dynatrace Alert Management Rule
  ansible.builtin.include_tasks: "{{ sn_discovery_common_dir }}/sn_rest_mutate.yml"
  vars:
    sn_rest_method: patch
    sn_rest_table: em_alert_management_rule
    sn_rest_sys_id: "{{ item.sys_id }}"
    sn_rest_body:
      active: "false"
  loop: "{{ sn_rest_json.result | default([]) }}"
  when:
    - sn_rest_status | default(0) == 200
    - item.active | default('') in ['true', '1', true, 1]
