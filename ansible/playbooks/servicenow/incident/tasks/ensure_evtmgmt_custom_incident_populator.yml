---
# Upsert global EvtMgmtCustomIncidentPopulator (AMR incident field customization).

- name: Build EvtMgmtCustomIncidentPopulator payload
  ansible.builtin.set_fact:
    sn_incident_populator_body:
      name: EvtMgmtCustomIncidentPopulator
      active: "true"
      access: public
      script: "{{ lookup('file', sn_incident_integrations_dir + '/EvtMgmtCustomIncidentPopulator.si.js') }}"

- name: Look up EvtMgmtCustomIncidentPopulator
  ansible.builtin.include_tasks: "{{ sn_discovery_common_dir }}/sn_rest_get.yml"
  vars:
    sn_rest_table: sys_script_include
    sn_rest_query: "sysparm_query=name=EvtMgmtCustomIncidentPopulator^sys_scope=global&sysparm_limit=1"

- name: Record EvtMgmtCustomIncidentPopulator state
  ansible.builtin.set_fact:
    sn_incident_populator_exists: "{{ (sn_rest_json.result | default([]) | length) > 0 }}"
    sn_incident_populator_sys_id: "{{ sn_rest_json.result[0].sys_id | default('') }}"

- name: Update EvtMgmtCustomIncidentPopulator
  ansible.builtin.include_tasks: "{{ sn_discovery_common_dir }}/sn_rest_mutate.yml"
  vars:
    sn_rest_method: patch
    sn_rest_table: sys_script_include
    sn_rest_sys_id: "{{ sn_incident_populator_sys_id }}"
    sn_rest_body: "{{ sn_incident_populator_body }}"
  when: sn_incident_populator_exists | bool

- name: Create EvtMgmtCustomIncidentPopulator
  ansible.builtin.include_tasks: "{{ sn_discovery_common_dir }}/sn_rest_mutate.yml"
  vars:
    sn_rest_method: post
    sn_rest_table: sys_script_include
    sn_rest_body: "{{ sn_incident_populator_body }}"
  when: not sn_incident_populator_exists | bool
