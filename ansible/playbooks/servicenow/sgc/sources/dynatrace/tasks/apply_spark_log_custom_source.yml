---
# Pattern: Standalone App with short Log4j2 logs
# Spec: standalone-short-log4j2-custom-source.json.j2
# Stamps: service_instance, log.path, log.driver.instance

- name: Resolve Dynatrace API credentials
  ansible.builtin.include_tasks: resolve_dt_api.yml

- name: Resolve Dynatrace specification paths
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../../../observability/dynatrace/common/resolve_dt_spec_paths.yml"

- name: Render Standalone short Log4j2 custom log source
  ansible.builtin.template:
    src: "{{ dt_integrations_dir }}/standalone-short-log4j2-custom-source.json.j2"
    dest: /tmp/standalone-short-log4j2-custom-source.json
    mode: "0644"
  delegate_to: localhost
  run_once: true

- name: Upsert Standalone short Log4j2 custom log source
  ansible.builtin.include_tasks: upsert_dt_settings_object.yml
  vars:
    dt_upsert_schema_id: builtin:logmonitoring.custom-log-source-settings
    dt_upsert_doc: "{{ lookup('file', '/tmp/standalone-short-log4j2-custom-source.json') | from_json }}"
    dt_upsert_match_key: config-item-title
    dt_upsert_match_value: "{{ dt_l2i_standalone_custom_source_name }}"

- name: Record custom log source objectId
  ansible.builtin.set_fact:
    dt_l2i_standalone_custom_source_object_id: "{{ dt_upsert_found_id }}"
  run_once: true

- name: Show Standalone custom log source state
  ansible.builtin.debug:
    msg: >-
      Custom log source '{{ dt_l2i_standalone_custom_source_name }}'
      => {{ dt_l2i_standalone_custom_source_object_id }}
      (service_instance={{ dt_l2i_standalone_service_instance }})
  run_once: true
