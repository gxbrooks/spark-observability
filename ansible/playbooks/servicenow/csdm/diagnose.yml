---
# Diff CSDM specifications against the ServiceNow instance via csdm-diff.
# Usage:
#   ansible-playbook -i inventory.yml playbooks/servicenow/csdm/diagnose.yml \
#     -e @../vars/secrets.yaml

- name: Diagnose ServiceNow CSDM model via csdm-diff
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../../../vars/contexts/servicenow_ansible_vars.yml"
    - "{{ playbook_dir }}/../../../../vars/secrets.yaml"
    - "{{ playbook_dir }}/../common/spec_roots.yml"
    - "{{ playbook_dir }}/common/vars.yml"
  tasks:
    - name: Require csdm-diff on PATH
      ansible.builtin.command:
        argv: ["{{ sn_csdm_diff_bin }}", "--help"]
      register: sn_csdm_diff_help
      changed_when: false
      failed_when: sn_csdm_diff_help.rc != 0

    - name: Build csdm-diff argv for explicit spec paths
      ansible.builtin.set_fact:
        sn_csdm_diff_argv: "{{ [sn_csdm_diff_bin, '--specs'] + (sn_csdm_spec_paths_override | map('expanduser') | list) + ['--inventory', sn_inventory_file] }}"
      when: sn_csdm_spec_paths_override | default([]) | length > 0

    - name: Build csdm-diff argv for specs-root
      ansible.builtin.set_fact:
        sn_csdm_diff_argv: "{{ [sn_csdm_diff_bin, '--specs-root', sn_specs_root] + (['--region', sn_region_filter] if (sn_region_filter | default('') | length) > 0 else []) + ['--inventory', sn_inventory_file] }}"
      when: sn_csdm_spec_paths_override | default([]) | length == 0

    - name: Diff CSDM model with csdm-diff
      ansible.builtin.command:
        argv: "{{ sn_csdm_diff_argv }}"
      environment:
        SN_URL: "{{ sn_url }}"
        SN_USER: "{{ sn_user }}"
        SN_PASSWORD: "{{ sn_password }}"
      register: sn_csdm_diff_result
      changed_when: false
      failed_when: sn_csdm_diff_result.rc not in [0, 1]

    - name: Show csdm-diff output
      ansible.builtin.debug:
        msg: "{{ sn_csdm_diff_result.stdout | default('(no stdout)') }}"

    - name: Note csdm-diff differences
      ansible.builtin.debug:
        msg: >-
          csdm-diff reported differences (exit {{ sn_csdm_diff_result.rc }}).
          Re-run csdm/deploy.yml or csdm-inject to converge the instance.
      when: sn_csdm_diff_result.rc == 1
