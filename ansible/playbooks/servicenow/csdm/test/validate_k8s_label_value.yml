---
# Local unit test for validate_k8s_label_value.yml (CSDM injector charset/length).
# Usage (from ansible/):
#   ansible-playbook playbooks/servicenow/csdm/test/validate_k8s_label_value.yml

- name: Validate Kubernetes label value helper
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    sn_common_tasks: "{{ playbook_dir }}/../../common/tasks"
  tasks:
    - name: Accept valid sanitized Spark service instance labels
      ansible.builtin.include_tasks: "{{ sn_common_tasks }}/validate_k8s_label_value.yml"
      vars:
        sn_k8s_label_value: "{{ item }}"
        sn_k8s_label_context: "unit test valid"
      loop:
        - Spark-Client
        - Spark-Master
        - Spark-Worker
        - Spark-History-Server
        - Dynatrace-OneAgent-Lab1
        - a
        - A1
        - x.y_z-1

    - name: Expect failure for empty label
      block:
        - name: Assert empty label fails
          ansible.builtin.include_tasks: "{{ sn_common_tasks }}/validate_k8s_label_value.yml"
          vars:
            sn_k8s_label_value: ""
            sn_k8s_label_context: "unit test empty"
      rescue:
        - name: Record empty-label failure
          ansible.builtin.set_fact:
            sn_k8s_empty_failed: true

    - name: Expect failure for spaces
      block:
        - name: Assert spaced label fails
          ansible.builtin.include_tasks: "{{ sn_common_tasks }}/validate_k8s_label_value.yml"
          vars:
            sn_k8s_label_value: "Spark Client"
            sn_k8s_label_context: "unit test spaces"
      rescue:
        - name: Record spaced-label failure
          ansible.builtin.set_fact:
            sn_k8s_space_failed: true

    - name: Expect failure for length > 63
      block:
        - name: Assert oversized label fails
          ansible.builtin.include_tasks: "{{ sn_common_tasks }}/validate_k8s_label_value.yml"
          vars:
            sn_k8s_label_value: "{{ 'A' * 64 }}"
            sn_k8s_label_context: "unit test length"
      rescue:
        - name: Record length failure
          ansible.builtin.set_fact:
            sn_k8s_length_failed: true

    - name: Expect failure for leading hyphen
      block:
        - name: Assert leading-hyphen label fails
          ansible.builtin.include_tasks: "{{ sn_common_tasks }}/validate_k8s_label_value.yml"
          vars:
            sn_k8s_label_value: "-Spark"
            sn_k8s_label_context: "unit test leading hyphen"
      rescue:
        - name: Record leading-hyphen failure
          ansible.builtin.set_fact:
            sn_k8s_leading_failed: true

    - name: Confirm negative cases failed as expected
      ansible.builtin.assert:
        that:
          - sn_k8s_empty_failed | default(false)
          - sn_k8s_space_failed | default(false)
          - sn_k8s_length_failed | default(false)
          - sn_k8s_leading_failed | default(false)
        fail_msg: >-
          Expected K8s label validation to reject empty/spaces/length/leading-hyphen cases.
