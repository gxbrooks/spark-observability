---
# Resolve Dynatrace specification paths under observability/dynatrace/ (single solution tree).
# Tenant/instance identity comes from vars (DT_TENANT_URL / DT_API_URL), not from the directory layout.
# Input (optional): dt_management_zone_slug — default DT_MANAGEMENT_ZONE_SLUG or DT_HOST_GROUP
# Output: dt_specs_root, dt_mz_dir, dt_mz_settings_file, dt_auto_tags_file,
#         dt_dashboards_dir, dt_dynakube_dir, dt_integrations_dir, dt_sampler_dir, dt_docs_dir

- name: Resolve repository and Dynatrace specification roots
  ansible.builtin.set_fact:
    sn_repo_root: "{{ (playbook_dir | regex_replace('/playbooks/.*', '')) | dirname }}"
  delegate_to: localhost
  run_once: true

- name: Set Dynatrace specification directory variables
  ansible.builtin.set_fact:
    dt_specs_root: "{{ dt_specs_root_override | default(sn_repo_root ~ '/observability/dynatrace') }}"
    dt_mz_slug_resolved: >-
      {{
        (dt_management_zone_slug | default('') | trim)
        or (DT_MANAGEMENT_ZONE_SLUG | default('') | trim)
        or (DT_HOST_GROUP | default('') | trim)
        or 'spark-observability'
      }}
  delegate_to: localhost
  run_once: true

- name: Resolve Dynatrace specification directory paths
  ansible.builtin.set_fact:
    dt_tenant_dir: "{{ dt_specs_root }}"
    dt_mz_dir: "{{ dt_specs_root }}/management-zones/{{ dt_mz_slug_resolved }}"
    dt_mz_settings_file: "{{ dt_specs_root }}/management-zones/{{ dt_mz_slug_resolved }}/management-zone.json"
    dt_auto_tags_file: "{{ dt_specs_root }}/management-zones/{{ dt_mz_slug_resolved }}/auto-tags.json.j2"
    dt_dashboards_dir: "{{ dt_specs_root }}/dashboards"
    dt_dynakube_dir: "{{ dt_specs_root }}/dynakube"
    dt_integrations_dir: "{{ dt_specs_root }}/integrations"
    dt_sampler_dir: "{{ dt_specs_root }}/sampler"
    dt_docs_dir: "{{ dt_specs_root }}/docs"
  delegate_to: localhost
  run_once: true

- name: Assert management-zone settings file exists
  ansible.builtin.assert:
    that:
      - dt_mz_settings_file is exists
    fail_msg: >-
      Missing {{ dt_mz_settings_file }}.
      Set DT_MANAGEMENT_ZONE_SLUG / DT_HOST_GROUP to match a folder under
      observability/dynatrace/management-zones/, or pass -e dt_management_zone_slug=.
  delegate_to: localhost
  run_once: true
