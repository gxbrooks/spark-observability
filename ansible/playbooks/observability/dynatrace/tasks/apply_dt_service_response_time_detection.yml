---
# Explicit, durable response-time (+ failure-rate) anomaly detection for every
# Dynatrace SERVICE-* entity running on Spark Observability hosts (Master,
# Worker, History Server, ...). Scoped to the spark-observability HOST_GROUP
# rather than to individual SERVICE entities: SERVICE ids are ephemeral
# (regenerated when OneAgent rediscovers a service after inactivity), so a
# HOST_GROUP scope is the durable IaC match key and it also covers services
# not yet discovered. responseTime uses fixed (not auto/adaptive-baseline)
# thresholds deliberately: auto mode needs historical data a newly-discovered
# service does not have, so a short test burst produces no anomaly even when
# correctly configured (verified empirically this session). Fixed thresholds
# (20ms all-requests / 50ms slowest-10%, >=3 req/min for 1 minute) are tight
# relative to this environment's observed idle response times (2-6ms) so a
# real load-driven slowdown trips them without requiring a baseline.
# builtin:anomaly-detection.services is single-object-per-scope, so this
# object fully replaces the inherited default for services in this host
# group; the spec mirrors failureRate too so that does not regress (values
# there still match this tenant's prior environment-scope default).

- name: Resolve Dynatrace API credentials
  ansible.builtin.include_tasks: resolve_dt_api.yml

- name: Resolve Dynatrace specification paths
  ansible.builtin.include_tasks: "{{ playbook_dir }}/common/resolve_dt_spec_paths.yml"

- name: Look up spark-observability host group in Dynatrace
  ansible.builtin.uri:
    url: "{{ dt_api_url_resolved }}/v2/entities?entitySelector=type(HOST_GROUP)&pageSize=100"
    method: GET
    headers:
      Authorization: "Api-Token {{ dt_api_token_resolved }}"
    status_code: [200]
  register: dt_host_groups
  delegate_to: localhost
  run_once: true

- name: Resolve spark-observability host group entity id
  ansible.builtin.set_fact:
    dt_spark_hostgroup_entity_id: >-
      {{ (dt_host_groups.json.entities | default([])
          | selectattr('displayName', 'equalto', DT_HOST_GROUP)
          | map(attribute='entityId') | list | first) | default('', true) }}
  run_once: true

- name: Fail when spark-observability host group is not found
  ansible.builtin.assert:
    that:
      - dt_spark_hostgroup_entity_id | length > 0
    fail_msg: >-
      HOST_GROUP '{{ DT_HOST_GROUP }}' not found in Dynatrace. OneAgent must have
      reported at least one host in this host group before this can be scoped.
  run_once: true

- name: Render service response-time anomaly detection payload
  ansible.builtin.template:
    src: "{{ dt_integrations_dir }}/spark-service-response-time-anomaly-detection.json.j2"
    dest: /tmp/spark-service-response-time-anomaly-detection.json
    mode: "0644"
  delegate_to: localhost
  run_once: true

- name: Load service response-time anomaly detection document
  ansible.builtin.set_fact:
    dt_service_rt_doc: "{{ lookup('file', '/tmp/spark-service-response-time-anomaly-detection.json') | from_json }}"
  run_once: true

- name: List existing anomaly-detection.services object for this host group
  ansible.builtin.uri:
    url: >-
      {{ dt_api_url_resolved }}/v2/settings/objects?schemaIds=builtin:anomaly-detection.services&scopes={{ dt_spark_hostgroup_entity_id }}&fields=objectId,value
    method: GET
    headers:
      Authorization: "Api-Token {{ dt_api_token_resolved }}"
    status_code: [200]
  register: dt_service_rt_list
  delegate_to: localhost
  run_once: true

- name: Record existing object id and value
  ansible.builtin.set_fact:
    dt_service_rt_object_id: "{{ (dt_service_rt_list.json['items'] | default([]) | first | default({})).objectId | default('') }}"
    dt_service_rt_existing_value: "{{ (dt_service_rt_list.json['items'] | default([]) | first | default({})).value | default({}) }}"
  run_once: true

- name: Determine whether service response-time settings change is needed
  ansible.builtin.set_fact:
    dt_service_rt_change_needed: >-
      {{ (dt_service_rt_object_id | length) == 0
         or (dt_service_rt_existing_value
             | combine(dt_service_rt_doc.value, recursive=True)) != dt_service_rt_existing_value }}
  run_once: true

- name: Create service response-time anomaly detection object
  ansible.builtin.uri:
    url: "{{ dt_api_url_resolved }}/v2/settings/objects"
    method: POST
    headers:
      Authorization: "Api-Token {{ dt_api_token_resolved }}"
      Content-Type: application/json
    body_format: json
    body:
      - "{{ dt_service_rt_doc }}"
    status_code: [200, 201]
  when: dt_service_rt_object_id | length == 0
  delegate_to: localhost
  run_once: true

- name: Update service response-time anomaly detection object
  ansible.builtin.uri:
    url: "{{ dt_api_url_resolved }}/v2/settings/objects/{{ dt_service_rt_object_id }}"
    method: PUT
    headers:
      Authorization: "Api-Token {{ dt_api_token_resolved }}"
      Content-Type: application/json
    body_format: json
    body: "{{ dt_service_rt_doc }}"
    status_code: [200, 204]
  when:
    - dt_service_rt_object_id | length > 0
    - dt_service_rt_change_needed | bool
  delegate_to: localhost
  run_once: true

- name: Show service response-time anomaly detection state
  ansible.builtin.debug:
    msg: >-
      builtin:anomaly-detection.services @ HOST_GROUP {{ DT_HOST_GROUP }}
      ({{ dt_spark_hostgroup_entity_id }}): {{ dt_service_rt_object_id | default('created') }}
      ({{ 'created/updated' if dt_service_rt_change_needed | bool else 'already up to date — no change applied' }})
  run_once: true
