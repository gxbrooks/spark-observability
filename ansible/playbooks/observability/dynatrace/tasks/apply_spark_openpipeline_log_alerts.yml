---
# Upsert L2I OpenPipeline log-alert pipelines and routing.
#
# Patterns:
#   Standalone App with short Log4j2 logs → standalone-short-log4j2-openpipeline.json.j2
#   K8s App with short Log4j2 logs       → k8s-short-log4j2-openpipeline.json.j2
# Routing: l2i-openpipeline-routing-entries.json.j2
#
# SN binds: service_instance (Standalone) or k8s.pod.name (K8s).

- name: Resolve Dynatrace API credentials
  ansible.builtin.include_tasks: resolve_dt_api.yml

- name: Resolve Dynatrace specification paths
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../../../observability/dynatrace/common/resolve_dt_spec_paths.yml"

- name: Render Standalone short Log4j2 OpenPipeline
  ansible.builtin.template:
    src: "{{ dt_integrations_dir }}/standalone-short-log4j2-openpipeline.json.j2"
    dest: /tmp/standalone-short-log4j2-openpipeline.json
    mode: "0644"
  delegate_to: localhost
  run_once: true

- name: Upsert Standalone short Log4j2 OpenPipeline
  ansible.builtin.include_tasks: upsert_dt_settings_object.yml
  vars:
    dt_upsert_schema_id: builtin:openpipeline.logs.pipelines
    dt_upsert_doc: "{{ lookup('file', '/tmp/standalone-short-log4j2-openpipeline.json') | from_json }}"
    dt_upsert_match_key: customId
    dt_upsert_match_value: "{{ dt_l2i_standalone_openpipeline_custom_id }}"
    dt_upsert_match_key_alt: displayName
    dt_upsert_match_value_alt: "{{ dt_l2i_standalone_openpipeline_display_name }}"

- name: Record Standalone OpenPipeline objectId
  ansible.builtin.set_fact:
    dt_l2i_standalone_pipeline_object_id: "{{ dt_upsert_found_id }}"
  run_once: true

- name: Render K8s short Log4j2 OpenPipeline
  ansible.builtin.template:
    src: "{{ dt_integrations_dir }}/k8s-short-log4j2-openpipeline.json.j2"
    dest: /tmp/k8s-short-log4j2-openpipeline.json
    mode: "0644"
  delegate_to: localhost
  run_once: true

- name: Upsert K8s short Log4j2 OpenPipeline
  ansible.builtin.include_tasks: upsert_dt_settings_object.yml
  vars:
    dt_upsert_schema_id: builtin:openpipeline.logs.pipelines
    dt_upsert_doc: "{{ lookup('file', '/tmp/k8s-short-log4j2-openpipeline.json') | from_json }}"
    dt_upsert_match_key: customId
    dt_upsert_match_value: "{{ dt_l2i_k8s_openpipeline_custom_id }}"
    dt_upsert_match_key_alt: displayName
    dt_upsert_match_value_alt: "{{ dt_l2i_k8s_openpipeline_display_name }}"

- name: Record K8s OpenPipeline objectId
  ansible.builtin.set_fact:
    dt_l2i_k8s_pipeline_object_id: "{{ dt_upsert_found_id }}"
  run_once: true

- name: Render L2I OpenPipeline routing entries
  ansible.builtin.template:
    src: "{{ dt_integrations_dir }}/l2i-openpipeline-routing-entries.json.j2"
    dest: /tmp/l2i-openpipeline-routing-entries.json
    mode: "0644"
  delegate_to: localhost
  run_once: true

- name: Load L2I routing entries
  ansible.builtin.set_fact:
    dt_l2i_routing_entries: "{{ lookup('file', '/tmp/l2i-openpipeline-routing-entries.json') | from_json }}"
  run_once: true

- name: List OpenPipeline logs routing configuration
  ansible.builtin.uri:
    url: "{{ dt_api_url_resolved }}/v2/settings/objects?schemaIds=builtin:openpipeline.logs.routing&fields=objectId,value&pageSize=10"
    method: GET
    headers:
      Authorization: "Api-Token {{ dt_api_token_resolved }}"
    status_code: [200]
  register: dt_openpipeline_logs_routing
  delegate_to: localhost
  run_once: true

- name: Select OpenPipeline logs routing object
  ansible.builtin.set_fact:
    dt_openpipeline_logs_routing_object_id: "{{ dt_openpipeline_logs_routing.json['items'][0].objectId }}"
    dt_openpipeline_logs_routing_existing: "{{ dt_openpipeline_logs_routing.json['items'][0].value }}"
  when: dt_openpipeline_logs_routing.json['items'] | default([]) | length > 0
  run_once: true

- name: Collect routing description strings to replace
  ansible.builtin.set_fact:
    dt_l2i_routing_descriptions_drop: >-
      {{
        [dt_l2i_standalone_routing_description, dt_l2i_k8s_routing_description]
        + (dt_l2i_routing_description_legacy | default([]))
      }}
  run_once: true

- name: Merge L2I routes ahead of other routing entries
  ansible.builtin.set_fact:
    dt_openpipeline_routing_entries_new: >-
      {{
        dt_l2i_routing_entries
        + (
            dt_openpipeline_logs_routing_existing.routingEntries | default([])
            | rejectattr('description', 'in', dt_l2i_routing_descriptions_drop)
            | list
          )
      }}
  run_once: true

- name: Update OpenPipeline logs routing for L2I patterns
  ansible.builtin.uri:
    url: "{{ dt_api_url_resolved }}/v2/settings/objects/{{ dt_openpipeline_logs_routing_object_id }}"
    method: PUT
    headers:
      Authorization: "Api-Token {{ dt_api_token_resolved }}"
      Content-Type: application/json
    body_format: json
    body:
      schemaId: builtin:openpipeline.logs.routing
      value:
        routingEntries: "{{ dt_openpipeline_routing_entries_new }}"
    status_code: [200, 204]
  when: dt_openpipeline_logs_routing_object_id | default('') | length > 0
  delegate_to: localhost
  run_once: true

- name: Show L2I OpenPipeline state
  ansible.builtin.debug:
    msg: >-
      Standalone '{{ dt_l2i_standalone_openpipeline_custom_id }}'
      => {{ dt_l2i_standalone_pipeline_object_id }};
      K8s '{{ dt_l2i_k8s_openpipeline_custom_id }}'
      => {{ dt_l2i_k8s_pipeline_object_id }};
      routing updated.
  run_once: true
