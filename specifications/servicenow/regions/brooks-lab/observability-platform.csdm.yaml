---
# Observability stack — CSDM specification
# Runtime labels: observability/docker-compose.yml (single source of truth)

business_applications:
  - name: Observability Platform
    identifier: observability-platform
    short_description: Monitoring, logging, metrics, and tracing
    operational_status: "1"
    active: "true"
    business_owner: gbrooks
    it_application_owner: gbrooks

business_services:
  - name: Elasticsearch
    identifier: elasticsearch
    short_description: Primary metrics, logs, and trace storage (Elastic Stack)
    operational_status: "1"
    parent_business_application: Observability Platform
    owned_by: gbrooks
    business_criticality: "4 - not critical"

  - name: Kibana
    identifier: kibana
    short_description: Elastic Stack UI and index management
    operational_status: "1"
    parent_business_application: Observability Platform
    owned_by: gbrooks
    business_criticality: "4 - not critical"

  - name: Grafana
    identifier: grafana
    short_description: Dashboards and visualization
    operational_status: "1"
    parent_business_application: Observability Platform
    owned_by: gbrooks
    business_criticality: "4 - not critical"

  - name: Prometheus
    identifier: prometheus
    short_description: Kubernetes and infrastructure metrics collection
    operational_status: "1"
    parent_business_application: Observability Platform
    owned_by: gbrooks
    business_criticality: "4 - not critical"

  - name: Grafana Tempo
    identifier: grafana-tempo
    short_description: Distributed trace storage and query
    operational_status: "1"
    parent_business_application: Observability Platform
    owned_by: gbrooks
    business_criticality: "4 - not critical"

  - name: OpenTelemetry Collector
    identifier: opentelemetry-collector
    short_description: OTLP ingest, Prometheus remote write, and export
    operational_status: "1"
    parent_business_application: Observability Platform
    owned_by: gbrooks
    business_criticality: "4 - not critical"

  - name: Logstash
    identifier: logstash
    short_description: Event and metrics pipeline into Elasticsearch
    operational_status: "1"
    parent_business_application: Observability Platform
    owned_by: gbrooks
    business_criticality: "4 - not critical"

business_service_offerings:
  - name: Elasticsearch - Production
    identifier: elasticsearch-production
    short_description: Production offering of Elasticsearch service instances
    operational_status: "1"
    parent_business_service: Elasticsearch
    owned_by: gbrooks
    business_criticality: "4 - not critical"

  - name: Kibana - Production
    identifier: kibana-production
    short_description: Production offering of Kibana service instances
    operational_status: "1"
    parent_business_service: Kibana
    owned_by: gbrooks
    business_criticality: "4 - not critical"

  - name: Grafana - Production
    identifier: grafana-production
    short_description: Production offering of Grafana service instances
    operational_status: "1"
    parent_business_service: Grafana
    owned_by: gbrooks
    business_criticality: "4 - not critical"

  - name: Prometheus - Production
    identifier: prometheus-production
    short_description: Production offering of Prometheus service instances
    operational_status: "1"
    parent_business_service: Prometheus
    owned_by: gbrooks
    business_criticality: "4 - not critical"

  - name: Grafana Tempo - Production
    identifier: grafana-tempo-production
    short_description: Production offering of Grafana Tempo service instances
    operational_status: "1"
    parent_business_service: Grafana Tempo
    owned_by: gbrooks
    business_criticality: "4 - not critical"

  - name: OpenTelemetry Collector - Production
    identifier: opentelemetry-collector-production
    short_description: Production offering of OpenTelemetry Collector service instances
    operational_status: "1"
    parent_business_service: OpenTelemetry Collector
    owned_by: gbrooks
    business_criticality: "4 - not critical"

  - name: Logstash - Production
    identifier: logstash-production
    short_description: Production offering of Logstash service instances
    operational_status: "1"
    parent_business_service: Logstash
    owned_by: gbrooks
    business_criticality: "4 - not critical"

service_instances:
  - name: Elasticsearch
    identifier: elasticsearch
    short_description: Elasticsearch — HTTPS API
    operational_status: "1"
    service_offering: Elasticsearch - Production
    platform: docker
    service_mapping: tags
    discover: false
    environment: on-prem
    location: brooks-lab
    owned_by: gbrooks
    business_criticality: "4 - not critical"

  - name: Kibana
    identifier: kibana
    short_description: Kibana UI
    operational_status: "1"
    service_offering: Kibana - Production
    platform: docker
    service_mapping: tags
    discover: false
    environment: on-prem
    location: brooks-lab
    owned_by: gbrooks
    business_criticality: "4 - not critical"
    depends_on:
      - Elasticsearch

  - name: Grafana
    identifier: grafana
    short_description: Grafana UI
    operational_status: "1"
    service_offering: Grafana - Production
    platform: docker
    service_mapping: tags
    discover: false
    environment: on-prem
    location: brooks-lab
    owned_by: gbrooks
    business_criticality: "4 - not critical"
    depends_on:
      - Elasticsearch
      - Prometheus
      - Grafana Tempo

  - name: Prometheus
    identifier: prometheus
    short_description: Prometheus TSDB and scrape API
    operational_status: "1"
    service_offering: Prometheus - Production
    platform: docker
    service_mapping: tags
    discover: false
    environment: on-prem
    location: brooks-lab
    owned_by: gbrooks
    business_criticality: "4 - not critical"
    depends_on:
      - OpenTelemetry Collector
      - Elasticsearch

  - name: Grafana Tempo
    identifier: grafana-tempo
    short_description: Tempo trace query HTTP API
    operational_status: "1"
    service_offering: Grafana Tempo - Production
    platform: docker
    service_mapping: tags
    discover: false
    environment: on-prem
    location: brooks-lab
    owned_by: gbrooks
    business_criticality: "4 - not critical"
    depends_on:
      - OpenTelemetry Collector
      - Elasticsearch

  - name: OpenTelemetry Collector
    identifier: opentelemetry-collector
    short_description: OTel Collector health and OTLP receivers
    operational_status: "1"
    service_offering: OpenTelemetry Collector - Production
    platform: docker
    service_mapping: tags
    discover: false
    environment: on-prem
    location: brooks-lab
    owned_by: gbrooks
    business_criticality: "4 - not critical"
    depends_on:
      - Elasticsearch
      - Dynatrace Tenant

  - name: Logstash
    identifier: logstash
    short_description: Logstash monitoring API and events input
    operational_status: "1"
    service_offering: Logstash - Production
    platform: docker
    service_mapping: tags
    discover: false
    environment: on-prem
    location: brooks-lab
    owned_by: gbrooks
    business_criticality: "4 - not critical"
    depends_on:
      - Elasticsearch
